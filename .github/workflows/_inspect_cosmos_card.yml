name: Inspect Cosmos flashcard handlers
on:
  push:
    paths:
      - '.github/workflows/_inspect_cosmos_card.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract relevant bundle excerpts
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          root=Path('games/albamen-cosmos')
          names=[f'app-safe.0{i}.b64' for i in range(5)]
          raw=''.join((root/n).read_text().strip() for n in names)
          code=gzip.decompress(base64.b64decode(''.join(raw.split()))).decode('utf-8','ignore')
          pats=['flash-card','card-actions','answer-side','Öğrendim','Tekrar Et','Cevabı görmek için karta dokun','Learned','Review','Hard']
          out=[]
          for pat in pats:
              pos=code.find(pat)
              out.append(f'\n===== {pat} @ {pos} =====\n')
              if pos>=0: out.append(code[max(0,pos-3000):pos+5000])
          (root/'_card_debug.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit excerpt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/albamen-cosmos/_card_debug.txt
          git commit -m 'Add temporary Cosmos flashcard handler excerpt' || exit 0
          git push