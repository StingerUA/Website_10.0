name: One-time harden non-TR account routes

on:
  push:
    branches:
      - fix/nontr-header-account-route-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nontr-header-account-route-hardening
          fetch-depth: 0
      - name: Patch localized header account routes
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = {
              'header-en.html': ('/eng/account-menu.html', '/eng/account.html'),
              'header-en-black.html': ('/eng/account-menu.html', '/eng/account.html'),
              'header-ru.html': ('/rus/account-menu.html', '/rus/account.html'),
              'header-ru-black.html': ('/rus/account-menu.html', '/rus/account.html'),
              'header-ar.html': ('/ar/account-menu.html', '/ar/account.html'),
              'header-ar-black.html': ('/ar/account-menu.html', '/ar/account.html'),
          }

          old_js = '/assets/js/worker-auth.js?v=20260826-google-auth-fix'
          new_js = '/assets/js/worker-auth.js?v=20260904-localized-account-v2'

          for filename, (old_menu, account) in routes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace(f'data-account-page="{old_menu}"', f'data-account-page="{account}"')
              text = text.replace("window.location.href = '/account-menu.html';", f"window.location.href = '{account}';")
              text = text.replace(old_js, new_js)
              if f'data-account-page="{account}"' not in text:
                  raise SystemExit(f'{filename}: localized data-account-page missing')
              if f"window.location.href = '{account}';" not in text:
                  raise SystemExit(f'{filename}: localized inline avatar route missing')
              if new_js not in text:
                  raise SystemExit(f'{filename}: cache-busted worker-auth missing')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/_one_time_harden_nontr_account_routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header-en.html header-en-black.html header-ru.html header-ru-black.html header-ar.html header-ar-black.html .github/workflows/_one_time_harden_nontr_account_routes.yml
          git commit -m "Harden localized header account routing"
          git push
