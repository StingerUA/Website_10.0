name: One-time wire Offline Staff Mode v1

on:
  push:
    branches:
      - feature/offline-staff-mode-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-staff-mode-v1
          fetch-depth: 0
      - name: Wire backend and frontend
        run: |
          python scripts/_wire_offline_staff.py
          git checkout -- .github/workflows/ci.yml
      - name: Validate syntax before commit
        run: |
          node --check cloudflare-worker/pass-offline-backend.js
          node --check cloudflare-worker/pass-entry.js
          node --check assets/js/pass-offline.js
          node --check assets/js/pass-staff.js
          node --check sw-pass-staff.js
          python scripts/check-pass-migrations.py
      - name: Commit verified Offline Staff Mode
        run: |
          rm scripts/_wire_offline_staff.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Offline Staff Mode v1"
          git push
