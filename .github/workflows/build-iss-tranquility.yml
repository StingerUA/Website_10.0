name: Build ISS Tranquility & Docked Cupola
on:
  push:
    branches: [main]
    paths:
      - 'tools/iss-interiors/build_tranquility_cupola.py'
      - '.github/workflows/build-iss-tranquility.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tranquility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model export dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'trimesh>=4,<5' 'pillow>=10,<13'
      - name: Export Tranquility with physically joined Cupola
        run: python tools/iss-interiors/build_tranquility_cupola.py
      - name: Confirm both GLB headers and embedded PBR textures
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct
          for kind in ('optimized','detailed'):
              file=Path('tools/iss-interiors/ISS_GLBS')/f'tranquility_{kind}.glb'
              data=file.read_bytes()
              assert data[:4]==b'glTF' and len(data)>50000
              length=struct.unpack_from('<I',data,12)[0]
              gltf=json.loads(data[20:20+length])
              assert len(gltf.get('images',[]))>=2
              assert any('Tranquility_ECLSS_WRS_Panel' in mesh.get('name','') for mesh in gltf.get('meshes',[]))
              print(file,len(data),'bytes',len(gltf['meshes']),'meshes')
          PY
      - name: Publish optimized and detailed module models
        run: |
          mkdir -p assets/models/interior
          cp tools/iss-interiors/ISS_GLBS/tranquility_*.glb assets/models/interior/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/interior/tranquility_optimized.glb assets/models/interior/tranquility_detailed.glb
          if ! git diff --cached --quiet; then
            git commit -m "Add Tranquility plus docked Cupola GLBs"
            git push
          fi
