name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Install dependencies and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build:atlas-nav

      - name: Validate header dropdown consistency
        run: node check-dropdown-css.js

      - name: Validate launch image scripts
        run: |
          node --check orbital-launch-images.js
          node --check cloudflare-worker/worker-with-rocket-images.js

      - name: Validate centralized LL2 proxy
        run: |
          node --check cloudflare-worker/worker-with-ll2-cache.js
          node --check cloudflare-worker/worker-with-ll2-fallback.js
          node --check cloudflare-worker/worker-with-ll2-auth.js
          node --check cloudflare-worker/worker-with-ll2-refresh.js
          node --check orbital-catalog.js
          node --check orbital-catalog-core.js

      - name: Validate orbital catalogue localization
        run: node --check orbital-dynamic-localization.js

      - name: Validate blog enhancements
        run: |
          node --check assets/js/blog-enhancements.js
          node -e "JSON.parse(require('fs').readFileSync('assets/data/blog-authors.json','utf8'))"

      - name: Validate restaurant AR engine and mobile models
        run: |
          node --check assets/js/restaurant-model-viewer.js
          node --check scripts/create-restaurant-turkish-dishes.mjs
          node --check scripts/bake-restaurant-ar-scale.mjs
          node --check scripts/compose-restaurant-serving-plates.mjs
          python scripts/check-glb-extensions.py assets/models/restaurant/wooden-cutting-board.glb assets/models/restaurant/ar/*.glb
