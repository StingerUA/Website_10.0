name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Install dependencies and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build:atlas-nav

      - name: Validate header dropdown consistency
        run: node check-dropdown-css.js

      - name: Validate launch image scripts
        run: |
          node --check orbital-launch-images.js
          node --check cloudflare-worker/worker-with-rocket-images.js

      - name: Validate orbital catalogue
        run: node --check orbital-catalog.js

      - name: Validate blog enhancements
        run: |
          node --check assets/js/blog-enhancements.js
          node -e "JSON.parse(require('fs').readFileSync('assets/data/blog-authors.json','utf8'))"
