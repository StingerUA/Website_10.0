name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Install dependencies and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build:atlas-nav

      - name: Validate header dropdown consistency
        run: node check-dropdown-css.js

      - name: Validate localized account routing
        run: |
          node --check assets/js/worker-auth.js
          node --check assets/js/account-avatar.js
          grep -q 'data-account-page="/eng/account.html"' header-en.html
          grep -q 'data-account-page="/eng/account.html"' header-en-black.html
          grep -q 'data-account-page="/rus/account.html"' header-ru.html
          grep -q 'data-account-page="/rus/account.html"' header-ru-black.html
          grep -q 'data-account-page="/ar/account.html"' header-ar.html
          grep -q 'data-account-page="/ar/account.html"' header-ar-black.html
          test -f ar/account.html
          grep -q "localizedAccountPage" assets/js/worker-auth.js

      - name: Validate multilingual AlbaSpace game
        run: node cloudflare-worker/tests/albaspace.audit.mjs

      - name: Validate persistent AlbaSpace station layout
        run: node cloudflare-worker/tests/station-layout.audit.mjs

      - name: Validate AlbaSpace cadet inspect interaction
        run: node cloudflare-worker/tests/cadet-inspect.audit.mjs

      - name: Validate launch image scripts
        run: |
          node --check orbital-launch-images.js
          node --check cloudflare-worker/worker-with-rocket-images.js

      - name: Validate centralized LL2 proxy
        run: |
          node --check cloudflare-worker/worker-with-ll2-cache.js
          node --check cloudflare-worker/worker-with-ll2-fallback.js
          node --check cloudflare-worker/worker-with-ll2-auth.js
          node --check cloudflare-worker/worker-with-ll2-refresh.js
          node --check orbital-catalog.js
          node --check orbital-catalog-core.js

      - name: Validate ALBA Space Pass
        run: |
          node --check cloudflare-worker/pass-backend.js
          node --check cloudflare-worker/pass-entry.js
          node --check cloudflare-worker/pass-offline-backend.js
          node --check assets/js/pass-api.js
          node --check assets/js/pass-locale.js
          node --check assets/js/pass-customer.js
          node --check assets/js/pass-art.js
          node --check assets/js/pass-staff.js
          node --check assets/js/pass-offline.js
          node --check assets/js/barcode-detector-qr-polyfill.js
          node --check assets/js/pass-admin.js
          node --check assets/js/account-pass-links.js
          node --check assets/js/events.js
          node --check sw-pass-staff.js
          grep -q 'jsqr@1.4.0/dist/jsQR.js' staff-pass.html
          grep -q 'barcode-detector-qr-polyfill.js' staff-pass.html
          grep -q 'jsqr@1.4.0/dist/jsQR.js' eng/staff-pass.html
          grep -q 'barcode-detector-qr-polyfill.js' eng/staff-pass.html
          grep -q 'jsqr@1.4.0/dist/jsQR.js' rus/staff-pass.html
          grep -q 'barcode-detector-qr-polyfill.js' rus/staff-pass.html
          python scripts/check-pass-migrations.py

      - name: Validate orbital catalogue localization
        run: node --check orbital-dynamic-localization.js

      - name: Validate blog enhancements
        run: |
          node --check assets/js/blog-enhancements.js
          node -e "JSON.parse(require('fs').readFileSync('assets/data/blog-authors.json','utf8'))"

      - name: Validate restaurant AR engine and mobile models
        run: |
          node --check assets/js/restaurant-model-viewer.js
          node --check scripts/create-restaurant-turkish-dishes.mjs
          node --check scripts/bake-restaurant-ar-scale.mjs
          node --check scripts/compose-restaurant-serving-plates.mjs
          python scripts/check-glb-extensions.py assets/models/restaurant/wooden-cutting-board.glb assets/models/restaurant/ar/*.glb
