name: Import AR restaurant models

on:
  push:
    branches:
      - fix/ar-restaurant-realistic-kebabs-scale
    paths:
      - .github/workflows/import-ar-restaurant-models.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download licensed realistic shawarma model
        run: |
          set -euo pipefail
          mkdir -p assets/models/restaurant/ar
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/andouu/dinner-menu/main/public/delicious_shawarma.glb \
            -o assets/models/restaurant/ar/realistic-turkish-shawarma.glb
          test "$(head -c 4 assets/models/restaurant/ar/realistic-turkish-shawarma.glb)" = 'glTF'

      - name: Download licensed doner kebab glTF and PBR textures
        run: |
          set -euo pipefail
          SRC='https://api.github.com/repos/maffittaaa/Yell-Point-Pray/contents/Content/3DModels/Kebab/30days3d_-_day_1_-_doner_kebab'
          DEST='assets/models/restaurant/ar/realistic-turkish-doner-kebab'
          mkdir -p "$DEST/textures"

          curl -fsSL "$SRC/scene.gltf" | jq -r '.download_url' | xargs -r curl -L --fail --retry 3 -o "$DEST/scene.gltf"
          curl -fsSL "$SRC/scene.bin" | jq -r '.download_url' | xargs -r curl -L --fail --retry 3 -o "$DEST/scene.bin"
          curl -fsSL "$SRC/textures" | jq -r '.[] | select(.type == "file") | [.name, .download_url] | @tsv' | \
            while IFS=$'\t' read -r name url; do
              curl -L --fail --retry 3 "$url" -o "$DEST/textures/$name"
            done

          test -s "$DEST/scene.gltf"
          test -s "$DEST/scene.bin"
          jq -e '.asset.version == "2.0"' "$DEST/scene.gltf" >/dev/null
          test "$(find "$DEST/textures" -type f | wc -l)" -ge 3

      - name: Wire new models into Turkish and Russian menus
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('assets/js/restaurant-model-viewer-core.js')
          text = core.read_text(encoding='utf-8')
          replacements = {
              "turkish-shish-kebab-plated.glb": "realistic-turkish-shawarma.glb",
              "turkish-adana-kebab-plated.glb": "realistic-turkish-doner-kebab/scene.gltf",
              "Közlenmiş sebzelerle servis edilen yüksek detaylı Türk şiş kebabı 3D modeli": "Lavaş, et ve taze sebzelerle hazırlanmış gerçekçi tavuk döner dürüm 3D modeli",
              "Türk Şiş Kebabı": "Tavuk Döner Dürüm",
              "Şişte ızgara et; közlenmiş biber, domates, soğan ve limonla servis edilir.": "Lavaş içinde döner et, domates ve taze sebzelerle servis edilir.",
              "Pide, közlenmiş sebzeler ve sumaklı soğanla servis edilen yüksek detaylı Adana kebabı 3D modeli": "Et, soğan ve taze yeşilliklerle hazırlanmış PBR döner kebap 3D modeli",
              "Adana Kebabı": "Döner Kebab",
              "Baharatlı kıyma kebabı; pide, közlenmiş domates, biber ve sumaklı soğanla.": "Et, soğan ve taze yeşilliklerle servis edilen döner kebap.",
              "Высокодетализированная 3D-модель турецкого шиш-кебаба с запечёнными овощами": "Реалистичная 3D-модель куриного донер-дюрюма с лавашом и свежими овощами",
              "Турецкий шиш-кебаб": "Куриный донер-дюрюм",
              "Мясо на шампурах с запечённым перцем, помидором, луком и лимоном.": "Донер в лаваше с помидором и свежими овощами.",
              "Высокодетализированная 3D-модель адана-кебаба с питой, овощами и луком с сумахом": "Реалистичная PBR 3D-модель донер-кебаба с мясом, луком и зеленью",
              "Адана-кебаб": "Донер-кебаб",
              "Пряный кебаб из рубленого мяса с питой, запечёнными овощами и луком с сумахом.": "Донер-кебаб с мясом, луком и свежей зеленью.",
              "const MODEL_VERSION = 'turkish-meat-scale-light-3';": "const MODEL_VERSION = 'real-meat-scale-4';",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected menu text: {old}')
              text = text.replace(old, new)
          core.write_text(text, encoding='utf-8')

          wrapper = Path('assets/js/restaurant-model-viewer.js')
          wrapper_text = wrapper.read_text(encoding='utf-8')
          wrapper_text = wrapper_text.replace(
              "./restaurant-model-viewer-core.js?v=restaurant-scale-fix-1",
              "./restaurant-model-viewer-core.js?v=restaurant-scale-fix-2",
          )
          wrapper.write_text(wrapper_text, encoding='utf-8')

          for html_path in (Path('ar-restaurant/index.html'), Path('rus/ar-restaurant/index.html')):
              html = html_path.read_text(encoding='utf-8')
              if 'ar-scale="auto"' not in html:
                  raise SystemExit(f'Missing ar-scale=auto in {html_path}')
              html = html.replace('ar-scale="auto"', 'ar-scale="fixed"')
              html = html.replace(
                  '/assets/js/restaurant-model-viewer.js?v=turkish-meat-scale-light-3',
                  '/assets/js/restaurant-model-viewer.js?v=real-meat-scale-4',
              )
              html_path.write_text(html, encoding='utf-8')
          PY

      - name: Add third-party attribution
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/models/restaurant/THIRD_PARTY_NOTICES.md')
          text = path.read_text(encoding='utf-8')
          marker = '### Новые модели донера (CC BY)'
          if marker not in text:
              block = '''\n\n### Новые модели донера (CC BY)\n\n`ar/realistic-turkish-shawarma.glb` заменяет прежний процедурный шиш-кебаб. Модель основана на [Delicious shawarma](https://sketchfab.com/3d-models/delicious-shawarma-97d635dcc3814366a41d811852db9818) автора **mrs_pancake (yura080297)**, опубликованной под лицензией **CC Attribution**. Локальная GLB-копия взята из публичного проекта `andouu/dinner-menu`; исходная карточка Sketchfab указывает 44.8k треугольников.\n\n`ar/realistic-turkish-doner-kebab/scene.gltf` и связанные `scene.bin`/PBR-текстуры заменяют прежний процедурный Adana kebab. Это [30Days3D - Day 1 - Doner Kebab](https://sketchfab.com/3d-models/30days3d-day-1-doner-kebab-ff4869fdc1014a87bd1401d1c4ad9460) автора **smokefumus**, лицензия **CC BY 4.0**. Исходный пакет и файл лицензии взяты из `maffittaaa/Yell-Point-Pray`; коммерческое использование разрешено при сохранении атрибуции.\n'''
              anchor = '\n### Клубнично-шоколадный торт\n'
              if anchor in text:
                  text = text.replace(anchor, block + anchor, 1)
              else:
                  text += block
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate imported assets and menu references
        run: |
          set -euo pipefail
          test -s assets/models/restaurant/ar/realistic-turkish-shawarma.glb
          test -s assets/models/restaurant/ar/realistic-turkish-doner-kebab/scene.gltf
          grep -q 'realistic-turkish-shawarma.glb' assets/js/restaurant-model-viewer-core.js
          grep -q 'realistic-turkish-doner-kebab/scene.gltf' assets/js/restaurant-model-viewer-core.js
          grep -q 'ar-scale="fixed"' ar-restaurant/index.html
          grep -q 'ar-scale="fixed"' rus/ar-restaurant/index.html

      - name: Commit imported model assets and menu wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/models/restaurant/ar/realistic-turkish-shawarma.glb \
            assets/models/restaurant/ar/realistic-turkish-doner-kebab \
            assets/models/restaurant/THIRD_PARTY_NOTICES.md \
            assets/js/restaurant-model-viewer-core.js \
            assets/js/restaurant-model-viewer.js \
            ar-restaurant/index.html \
            rus/ar-restaurant/index.html
          if git diff --cached --quiet; then
            echo 'Assets and menu are already up to date.'
            exit 0
          fi
          git commit -m 'Replace first meat dishes with realistic licensed models'
          git pull --rebase origin fix/ar-restaurant-realistic-kebabs-scale
          git push origin HEAD:fix/ar-restaurant-realistic-kebabs-scale
