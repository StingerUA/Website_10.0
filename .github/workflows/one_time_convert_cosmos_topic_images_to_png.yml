name: One-time convert Cosmos topic images to PNG

on:
  push:
    paths:
      - '.github/workflows/one_time_convert_cosmos_topic_images_to_png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Convert WebP topic images to PNG
        shell: bash
        run: |
          set -euo pipefail
          root="games/albamen-cosmos/assets/topic-images"
          count=0
          while IFS= read -r -d '' f; do
            out="${f%.webp}.png"
            convert "$f" -strip "$out"
            rm "$f"
            count=$((count+1))
          done < <(find "$root" -type f -name '*.webp' -print0)
          echo "Converted $count WebP files to PNG."

      - name: Commit PNG migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- games/albamen-cosmos/assets/topic-images; then
            echo "No topic-image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/albamen-cosmos/assets/topic-images
          git commit -m "Convert Cosmos topic card images to PNG"
          git push origin HEAD:main
