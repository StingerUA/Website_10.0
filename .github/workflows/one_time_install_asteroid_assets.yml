name: One-time install Cosmos asteroid assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_install_asteroid_assets.yml'
      - 'games/albamen-cosmos/assets/_staging/asteroids96.part*.b64'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore asteroid image archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/asteroids
          cat games/albamen-cosmos/assets/_staging/asteroids96.part*.b64 > /tmp/asteroids.b64
          base64 -d /tmp/asteroids.b64 > /tmp/asteroids.zip
          unzip -t /tmp/asteroids.zip
          unzip -o /tmp/asteroids.zip -d /tmp/asteroids
          test "$(find /tmp/asteroids -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 20
          out='games/albamen-cosmos/assets/topic-images/05-asteroids-comets'
          mkdir -p "$out"
          find "$out" -maxdepth 1 -type f -name '*.webp' -delete
          cp /tmp/asteroids/*.webp "$out"/
          test "$(find "$out" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 20
      - name: Commit real asteroid images and clean staging
        run: |
          set -euo pipefail
          rm -f games/albamen-cosmos/assets/_staging/asteroids96.part*.b64
          rm -f .github/workflows/one_time_install_asteroid_assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install real asteroid and comet F/B images"
          git push origin HEAD:main
