<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050b1a">
  <meta name="description" content="Alba Space görsel işaretçi tabanlı tarayıcı AR restoran menüsü.">
  <title>AR Menü — Alba Space</title>
  <link rel="stylesheet" href="/assets/css/restaurant-ar.css?v=anchor-2">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <main id="ar-app" class="ar-app" aria-label="Alba Space AR restoran menüsü">
    <a-scene id="ar-scene"
      mindar-image="imageTargetSrc: /assets/ar/alba-table-anchor.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; antialias: true">
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.7"></a-entity>
      <a-entity light="type: directional; color: #fff4df; intensity: 1.2" position="0 1 1"></a-entity>
      <a-entity id="dish-anchor" mindar-image-target="targetIndex: 0">
        <a-entity id="dish-model"
          gltf-model="/assets/models/restaurant/realistic-steak-board.glb?v=anchor-2"
          position="0 0 0.03"
          rotation="-90 0 0"
          scale="0.28 0.28 0.28">
        </a-entity>
      </a-entity>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <header class="top-bar" aria-label="Навигация">
      <div class="top-brand" aria-label="Alba Space AR Menu">AR <span>MENU</span></div>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="menu-panel">Menü</button>
    </header>

    <section id="status-card" class="status-card" aria-live="polite" hidden>
      <div class="loading-mark" aria-hidden="true"><span></span></div>
      <div class="status-copy">
        <strong id="status-label">Yemek kataloğu yükleniyor</strong>
        <span id="status-detail">Lütfen bekleyin</span>
      </div>
      <div class="loading-bar" aria-hidden="true"><span id="loading-progress"></span></div>
    </section>

    <section id="menu-panel" class="menu-panel" hidden aria-labelledby="menu-title">
      <div class="menu-panel-head">
        <div>
          <span class="menu-kicker">ALBA SPACE</span>
          <h1 id="menu-title">Menü</h1>
        </div>
        <button id="menu-close" class="menu-close" type="button" aria-label="Menüyü kapat">×</button>
      </div>
      <p class="menu-anchor-note">Bu görseli masanın üzerine yerleştirin. Yemekler aynı görsel işaretçiye bağlanır.</p>
      <div class="menu-anchor-preview"><img src="/assets/ar/alba-table-anchor.jpeg" alt="Masaya yerleştirilecek görsel işaretçi"></div>
      <div id="menu-category-buttons" class="menu-categories" role="tablist" aria-label="Yemek kategorileri"></div>
      <div id="menu-item-buttons" class="menu-items" aria-live="polite"></div>
    </section>

    <button id="camera-start-fallback" class="camera-start-fallback" type="button" hidden>Kamerayı başlat</button>

    <div class="capture-dock" aria-label="AR sahnesi çekimi">
      <button id="capture-button" class="capture-button" type="button" aria-label="Fotoğraf çekmek için kısa, video için uzun basın"></button>
      <span id="capture-timer" class="capture-timer" aria-live="polite" hidden>00:30</span>
    </div>

    <div class="zoom-hint" aria-hidden="true">İki parmakla yakınlaştırın / uzaklaştırın</div>
  </main>
  <script type="module" src="/assets/js/restaurant-ar.js?v=anchor-2"></script>
</body>
</html>
