  <script>
    function changeImage(btn,src){
      document.getElementById('mainImage').src=src;
      document.querySelectorAll('.thumb-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    }
    function updateQty(d){
      const i=document.getElementById('qtyInput');
      i.value=Math.max(1,parseInt(i.value||1)+d);
    }
    function selectSize(btn){
      document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    }
    const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:0.08});
    document.querySelectorAll('.p-reveal').forEach(el=>obs.observe(el));
    document.getElementById('addToCartBtn').addEventListener('click',function(){
      const btn=this,qty=parseInt(document.getElementById('qtyInput').value||1,10);
      if(typeof cartManager!=='undefined')cartManager.addItem({
        id:btn.dataset.productId,name:btn.dataset.productName,
        price:Number(btn.dataset.productPrice),image:btn.dataset.productImage,
        url:window.location.pathname,qty
      });
      btn.classList.add('added');btn.textContent=btn.dataset.addedLabel||'✓ تمت الإضافة!';btn.disabled=true;
      setTimeout(()=>{btn.classList.remove('added');btn.textContent=btn.dataset.addLabel||'أضف إلى السلة';btn.disabled=false},1600);
    });
  </script>
  <script src="/assets/js/related-products.js" defer></script>
<script>
(function () {
  const button = document.getElementById('whatsappPayBtn');
  if (!button) return;
  button.addEventListener('click', function (event) {
    event.preventDefault();
    const addButton = document.getElementById('addToCartBtn');
    const productName = (addButton && addButton.dataset.productName) || document.querySelector('.product-title')?.textContent.trim() || document.title;
    const quantity = Math.max(1, parseInt(document.getElementById('qtyInput')?.value || '1', 10) || 1);
    const price = document.querySelector('.product-price-current')?.textContent.trim() || '';
    const language = (document.documentElement.lang || 'tr').toLowerCase().slice(0, 2);
    const templates = {
      tr: 'Merhaba, "{name}" ürününü WhatsApp üzerinden satın almak istiyorum.\nAdet: {qty}\nFiyat: {price}\nÖdeme adımlarını paylaşabilir misiniz?',
      ru: 'Здравствуйте! Хочу приобрести товар «{name}» и оплатить через WhatsApp.\nКоличество: {qty}\nЦена: {price}\nПожалуйста, сообщите, как произвести оплату.',
      en: 'Hello! I would like to purchase "{name}" and arrange payment via WhatsApp.\nQuantity: {qty}\nPrice: {price}\nPlease send me the payment instructions.',
      ar: 'مرحبًا، أود شراء "{name}" وإتمام الدفع عبر واتساب.\nالكمية: {qty}\nالسعر: {price}\nيرجى إرسال تعليمات الدفع.'
    };
    const message = (templates[language] || templates.tr).replaceAll('{name}', productName).replaceAll('{qty}', String(quantity)).replaceAll('{price}', price);
    window.open('https://wa.me/905387781018?text=' + encodeURIComponent(message), '_blank', 'noopener,noreferrer');
  });
})();
</script>
