<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="VR space experience">
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#020814"/><stop offset=".48" stop-color="#092547"/><stop offset="1" stop-color="#25104a"/></linearGradient>
  <radialGradient id="neb"><stop stop-color="#51c8ff" stop-opacity=".8"/><stop offset=".35" stop-color="#2077ff" stop-opacity=".35"/><stop offset="1" stop-color="#172a72" stop-opacity="0"/></radialGradient>
  <radialGradient id="planet"><stop offset="0" stop-color="#ffcf71"/><stop offset=".48" stop-color="#d87536"/><stop offset="1" stop-color="#442346"/></radialGradient>
  <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset=".55" stop-color="#0b3048"/><stop offset="1" stop-color="#07101b"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="stars" width="155" height="118" patternUnits="userSpaceOnUse"><circle cx="17" cy="23" r="1.6" fill="#fff"/><circle cx="69" cy="13" r=".9" fill="#91d7ff"/><circle cx="128" cy="54" r="1.4" fill="#d9efff"/><circle cx="42" cy="94" r="1" fill="#fff"/><circle cx="111" cy="101" r=".8" fill="#a899ff"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#stars)" opacity=".8"/>
<ellipse cx="1120" cy="360" rx="520" ry="350" fill="url(#neb)" filter="url(#glow)" opacity=".85"/>
