<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password – Alba Space</title>
  <meta name="description" content="Request a secure password reset link for your AlbaSpace account.">
  <link rel="icon" type="image/png" href="/assets/icons/AlbaLogo.png">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/fix-layout.css">
  <script src="/assets/js/include.js" defer></script>
  <script src="/assets/js/menu-toggle.js" defer></script>
  <script src="/assets/js/password-reset-pages.js" defer></script>
  <style>
    html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:Inter,system-ui,sans-serif}.pr-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 18px 60px;box-sizing:border-box}.pr-card{width:100%;max-width:460px;padding:34px;background:rgba(15,23,42,.9);border:1px solid rgba(0,194,255,.2);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.pr-card h1{margin:0 0 10px;font-size:26px;color:#f8fafc}.pr-card p{color:#94a3b8;line-height:1.6}.pr-field{margin-top:22px}.pr-field label{display:block;margin-bottom:7px;font-size:13px;color:#cbd5e1}.pr-input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid rgba(0,194,255,.22);background:#020617;color:#e2e8f0;font-size:15px;outline:none}.pr-input:focus{border-color:#00c2ff}.pr-button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#00c2ff;color:#020617;font-weight:800;font-size:15px;cursor:pointer}.pr-button:disabled{opacity:.55;cursor:not-allowed}.pr-message{min-height:22px;margin-top:16px;font-size:13px;line-height:1.5}.pr-message.is-success{color:#86efac}.pr-message.is-error{color:#fca5a5}.pr-back{display:inline-block;margin-top:18px;color:#7dd3fc;text-decoration:none;font-size:13px}.pr-note{font-size:12px!important;color:#64748b!important}@media(max-width:600px){.pr-card{padding:26px 20px}.pr-wrap{align-items:flex-start;padding-top:92px}}
  </style>
</head>
<body>
  <div data-include="/header-en.html"></div>
  <main class="pr-wrap">
    <section class="pr-card">
      <h1>Reset your password</h1>
      <p>Enter your email address. If an account exists, we will send you a one-time password reset link.</p>
      <form id="passwordResetRequestForm">
        <div class="pr-field">
          <label for="passwordResetEmail">Email</label>
          <input class="pr-input" id="passwordResetEmail" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <button class="pr-button" id="passwordResetRequestButton" type="submit">Send reset link</button>
      </form>
      <div class="pr-message" id="passwordResetMessage" role="status" aria-live="polite"></div>
      <p class="pr-note">For security, this page does not reveal whether an account exists.</p>
      <a class="pr-back" href="/eng/account-menu.html">← Back to sign in</a>
    </section>
  </main>
  <div data-include="/footer-en.html"></div>
</body>
</html>
