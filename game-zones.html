<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alba Space — AR Прятки: выбери зону</title>

<!-- Leaflet — бесплатная библиотека карт, без API-ключа -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #020617; color: #e5e7eb;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 20px 14px;
    background: linear-gradient(to bottom, rgba(2,6,23,0.95), rgba(2,6,23,0.7));
  }
  h1 { font-size: 18px; color: #38bdf8; letter-spacing: 0.04em; }
  p.sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }

  #map { width: 100%; height: 48vh; min-height: 300px; }

  #zone-list { padding: 16px 16px 60px; display: flex; flex-direction: column; gap: 10px; }
  .zone-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-radius: 14px;
    background: rgba(15,23,42,0.7);
    border: 1px solid rgba(148,163,184,0.15);
  }
  .zone-info .name { font-size: 15px; font-weight: 700; color: #e2e8f0; }
  .zone-info .count { font-size: 12px; color: #64748b; margin-top: 2px; }
  .zone-info .count.has-anchors { color: #6ee7b7; }
  .go-btn {
    padding: 9px 16px; border-radius: 99px; border: none;
    background: linear-gradient(135deg, #00c2ff, #0077b6);
    color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
    text-decoration: none; white-space: nowrap;
  }
  .go-btn.disabled { opacity: 0.35; pointer-events: none; }

  #status-msg { padding: 14px 20px; font-size: 13px; color: #94a3b8; text-align: center; }

  .hide-link {
    display: block; margin: 6px 16px 20px; text-align: center;
    padding: 12px; border-radius: 12px;
    border: 1px dashed rgba(56,189,248,0.35);
    color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <h1>🗺️ AR Прятки — выбери зону</h1>
  <p class="sub">Найди зону поблизости и начни поиск спрятанной 3D-модели</p>
</header>

<div id="map"></div>
<div id="status-msg">Определяем твоё местоположение…</div>
<div id="zone-list"></div>

<a class="hide-link" href="game-hide.html">📸 Хочу спрятать модель</a>

<script>
// ⚠️ ПОСЛЕ ДЕПЛОЯ WORKER'А — впиши сюда его адрес.
// Пример: "https://albaspace-game-api.твой-логин.workers.dev"
const API_BASE = "https://albaspace-game-api.nncdecdgc.workers.dev/api/zones";

let map;
let userMarker = null;

function initMap(centerLat, centerLon) {
  map = L.map('map').setView([centerLat, centerLon], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19,
  }).addTo(map);
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

async function loadZones(userLat, userLon) {
  const statusEl = document.getElementById('status-msg');
  const listEl = document.getElementById('zone-list');

  try {
    const res = await fetch(`${API_BASE}/api/zones`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка загрузки зон');

    statusEl.style.display = 'none';
    listEl.innerHTML = '';

    data.zones.forEach(zone => {
      // Круг зоны на карте
      const inRange = userLat != null ? haversine(userLat, userLon, zone.lat, zone.lon) <= zone.radius_m : false;
      const circle = L.circle([zone.lat, zone.lon], {
        radius: zone.radius_m,
        color: zone.anchor_count > 0 ? '#00c2ff' : '#475569',
        fillColor: zone.anchor_count > 0 ? '#00c2ff' : '#475569',
        fillOpacity: 0.15,
      }).addTo(map);
      circle.bindPopup(`<b>${zone.name}</b><br>Якорей: ${zone.anchor_count}`);

      // Карточка в списке
      const card = document.createElement('div');
      card.className = 'zone-card';
      card.innerHTML = `
        <div class="zone-info">
          <div class="name">${zone.name}</div>
          <div class="count ${zone.anchor_count > 0 ? 'has-anchors' : ''}">
            ${zone.anchor_count > 0 ? `🎯 ${zone.anchor_count} якорей` : 'Пока пусто'}
          </div>
        </div>
        <a class="go-btn ${zone.anchor_count === 0 ? 'disabled' : ''}" href="game-scanner.html?zone=${zone.id}">
          Искать
        </a>`;
      listEl.appendChild(card);
    });
  } catch (err) {
    statusEl.textContent = '⚠️ Не удалось загрузить зоны: ' + err.message;
  }
}

// ── Геолокация пользователя ──
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      initMap(latitude, longitude);
      L.marker([latitude, longitude]).addTo(map).bindPopup('Ты здесь').openPopup();
      loadZones(latitude, longitude);
    },
    () => {
      // Геолокация не разрешена — центрируем карту на первой зоне после загрузки
      initMap(37.9144, 40.2306);
      loadZones(null, null);
      document.getElementById('status-msg').textContent =
        '📍 Разреши доступ к геолокации, чтобы видеть расстояние до зон';
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
} else {
  initMap(37.9144, 40.2306);
  loadZones(null, null);
}
</script>
</body>
</html>
