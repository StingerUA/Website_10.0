<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>AlbaSpace - Labirent Deneyimi</title>

    <!-- Базовые библиотеки A-Frame и AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Физический движок Ammo.js -->
    <script src="https://mixedreality.mozilla.org/ammo.js/builds/ammo.wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- Компонент для разделения GLB на визуальную и физическую части -->
    <script src="https://unpkg.com/aframe-gltf-part-component/dist/aframe-gltf-part-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050a1f; 
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .branding {
            color: #00ffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
            background: rgba(5, 10, 31, 0.6);
            padding: 12px 35px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        #status-message {
            align-self: center;
            background: rgba(0, 255, 255, 0.05);
            color: #ffffff;
            padding: 16px 32px;
            border-radius: 30px;
            margin-bottom: 20px;
            font-size: 15px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            transition: opacity 0.4s ease;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.1); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); }
            100% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.1); }
        }
    </style>

    <script>
        // Управление логикой уровня
        AFRAME.registerComponent('level-manager', {
            schema: {
                // Координаты старта шарика (настрой под свой лабиринт)
                startPos: { type: 'vec3', default: { x: -0.4, y: 0.1, z: -0.4 } } 
            },

            init: function () {
                this.ball = document.querySelector('#player-ball');
                this.uiMessage = document.querySelector('#status-message');
                
                this.el.addEventListener('markerFound', () => {
                    this.uiMessage.style.opacity = '0'; // Прячем надпись
                    this.resetBall();
                });

                this.el.addEventListener('markerLost', () => {
                    this.uiMessage.style.opacity = '1'; // Показываем надпись
                    
                    // Прячем шарик далеко за пределы камеры
                    if (this.ball) {
                        this.ball.setAttribute('position', '0 100 0');
                    }
                });
            },

            resetBall: function () {
                if (!this.ball || !this.ball.body) return;

                // 1. Телепортация на позицию старта
                this.ball.setAttribute('position', this.data.startPos);

                // 2. Полный сброс физики, чтобы шарик не улетел по инерции
                const body = this.ball.body;
                const zeroVec = new Ammo.btVector3(0, 0, 0);
                
                body.setLinearVelocity(zeroVec);
                body.setAngularVelocity(zeroVec);
                body.clearForces();
                
                Ammo.destroy(zeroVec);
            }
        });
    </script>
</head>
<body>

    <!-- UI Слой -->
    <div id="ui-layer">
        <div class="top-bar">
            <div class="branding">ALBASPACE</div>
        </div>
        <div id="status-message">Labirent kartını kameraya gösterin</div>
    </div>

    <!-- AR Сцена с глобальной гравитацией -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
        physics="driver: ammo; debug: false; gravity: -9.8"
        renderer="antialias: true; alpha: true; colorManagement: true;">

        <a-assets>
            <!-- Сюда пропиши пути к своим .glb файлам -->
            <a-asset-item id="maze1" src="./assets/maze1.glb"></a-asset-item>
            <!-- <a-asset-item id="svetaModel" src="./assets/sveta.glb"></a-asset-item> -->
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Единый глобальный объект персонажа/шарика -->
        <a-sphere 
            id="player-ball" 
            radius="0.02" 
            position="0 100 0" 
            visible="false"
            ammo-body="type: dynamic; mass: 2; friction: 0.1; restitution: 0.4" 
            ammo-shape="type: sphere">
            
            <!-- Металлический визуальный шарик (диаметр 0.4см в масштабе модели) -->
            <a-sphere radius="0.02" color="#00ffff" material="metalness: 0.9; roughness: 0.1;"></a-sphere>
            
            <!-- Когда подготовишь модель Светы, раскомментируй эту строку и сбалансируй scale -->
            <!-- <a-entity gltf-model="#svetaModel" scale="0.05 0.05 0.05" position="0 -0.02 0"></a-entity> -->
            
        </a-sphere>

        <!-- Первый уровень. Маркер из папки scanner -->
        <a-marker 
            type="pattern" 
            url="./scanner/targets/maze1.patt" 
            id="marker1" 
            level-manager="startPos: -0.3 0.05 -0.3">
            
            <!-- Визуальный лабиринт -->
            <a-entity 
                gltf-part="src: #maze1; part: Maze_Visual" 
                position="0 0 0"
                scale="1 1 1">
            </a-entity>

            <!-- Физический коллайдер -->
            <!-- Важно: тип kinematic двигает его вместе с маркером -->
            <a-entity 
                gltf-part="src: #maze1; part: Maze_Collider" 
                visible="false"
                position="0 0 0"
                scale="1 1 1"
                ammo-body="type: kinematic" 
                ammo-shape="type: mesh">
            </a-entity>

        </a-marker>

    </a-scene>

</body>
</html>
