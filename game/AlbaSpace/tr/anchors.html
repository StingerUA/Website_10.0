<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alba Space · AR anchors</title><link rel="stylesheet" href="./assets/css/game.css"><style>body{padding:24px}.anchor-sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:900px;margin:0 auto}.anchor-card{background:#fff;color:#07101c;border:3px dashed #0f172a;border-radius:16px;padding:24px;text-align:center;break-inside:avoid}.anchor-card canvas{display:block;margin:16px auto 8px;max-width:220px;width:100%;height:auto}.anchor-id{font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900;letter-spacing:.06em}.anchor-note{max-width:900px;margin:0 auto 24px}@media print{body{background:#fff;color:#07101c}.anchor-note,.topbar{display:none}.anchor-sheet{max-width:none}.anchor-card{border-color:#000}}</style></head><body><div class="topbar"><div><div class="brand">Alba Space · AR ANCHORS</div><div class="phase">Yazdırın ve ankrajı her oyuncunun önüne koyun</div></div><button class="btn primary" onclick="print()">Yazdır</button></div><p class="anchor-note muted">Her QR kodu yalnızca masa kimliğini içerir. AR modunda oyuncunun telefonu TABLE-XX kodunu tanır ve istasyon arayüzünü kamera görüntüsüne sabitler.</p><main id="anchors" class="anchor-sheet"></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script>const host=document.getElementById('anchors'); for(let i=1;i<=10;i++){const id=`TABLE-${String(i).padStart(2,'0')}`;const card=document.createElement('section');card.className='anchor-card';card.innerHTML=`<div class="anchor-id">${id}</div><canvas></canvas><div>Alba Space · AR station anchor</div>`;host.append(card);QRCode.toCanvas(card.querySelector('canvas'),id,{width:220,margin:2,errorCorrectionLevel:'M'});}</script></body></html>
