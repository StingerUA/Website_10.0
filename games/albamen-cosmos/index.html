<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07091A">
<title>ALBAMEN Cosmos — AlbaSpace</title>
<link rel="stylesheet" href="style.css">
<style>
.albamen-home-card{display:flex;align-items:center;gap:14px;overflow:hidden;position:relative}
.albamen-home-card img{width:74px;height:92px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 8px 16px rgba(0,212,255,.28));animation:albamen-float 3s ease-in-out infinite}
.albamen-home-card .albamen-label{font-size:11px;letter-spacing:.1em;font-weight:800;color:#22d3ee;margin-bottom:5px}
.albamen-home-card p{margin:0;line-height:1.55}
.albamen-feedback{display:flex!important;align-items:center;gap:14px;padding:14px!important;overflow:hidden}
.albamen-avatar-wrap{width:76px;min-width:76px;height:92px;display:flex;align-items:flex-end;justify-content:center;align-self:stretch}
.albamen-avatar{width:72px;height:92px;object-fit:contain;transform-origin:50% 100%}
.albamen-feedback-copy{display:flex;flex-direction:column;gap:6px;min-width:0}
.albamen-feedback-copy strong{display:block;font-size:13px}
.albamen-feedback-copy span{font-size:13px;line-height:1.55}
.albamen-feedback.is-correct{border-color:rgba(34,197,94,.35)!important;background:linear-gradient(135deg,rgba(34,197,94,.09),rgba(79,110,247,.08))!important}
.albamen-feedback.is-correct .albamen-avatar{animation:albamen-celebrate .72s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 17px rgba(34,197,94,.55))}
.albamen-feedback.is-wrong{border-color:rgba(251,113,133,.28)!important;background:linear-gradient(135deg,rgba(251,113,133,.07),rgba(79,110,247,.08))!important}
.albamen-feedback.is-wrong .albamen-avatar{animation:albamen-encourage .56s ease-in-out;filter:drop-shadow(0 0 13px rgba(251,113,133,.3))}
.albamen-result-avatar{height:150px;max-width:160px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(0,212,255,.42));animation:albamen-float 3s ease-in-out infinite;margin:-8px auto 4px}
.albamen-auth-avatar{height:120px;max-width:130px;object-fit:contain;margin:-18px auto -4px;display:block;filter:drop-shadow(0 0 20px rgba(0,212,255,.38));animation:albamen-float 3s ease-in-out infinite}
@keyframes albamen-celebrate{0%{transform:translateY(0) scale(1)}28%{transform:translateY(-15px) scale(1.08) rotate(-2deg)}55%{transform:translateY(0) scale(1.03) rotate(2deg)}78%{transform:translateY(-6px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
@keyframes albamen-encourage{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-2deg)}45%{transform:translateX(5px) rotate(2deg)}70%{transform:translateX(-3px) rotate(-1deg)}}
@keyframes albamen-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-width:520px){.albamen-avatar-wrap{width:64px;min-width:64px;height:82px}.albamen-avatar{width:62px;height:82px}.albamen-home-card img{width:62px;height:82px}.albamen-result-avatar{height:130px}.albamen-auth-avatar{height:105px}}
</style>
</head>
