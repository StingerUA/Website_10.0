<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07091A">
<title>ALBAMEN Cosmos — AlbaSpace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading" class="loading"><div><strong>ALBAMEN Cosmos</strong><span>Loading…</span></div></div>
<div id="auth" class="auth-screen hidden"></div>
<div id="app" class="hidden">
  <div class="account-strip"><div id="account-name" class="account-name"></div><div id="lang-top" class="lang"></div></div>
  <main id="view" class="shell"></main>
  <nav id="nav" class="bottom-nav"></nav>
</div>
<script type="module">
try{
 const rs=await Promise.all(['app.001.txt','app.002.txt'].map(x=>fetch(x,{cache:'force-cache'})));
 if(rs.some(r=>!r.ok))throw new Error('app');
 const code=(await Promise.all(rs.map(r=>r.text()))).join('');
 await import(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));
}catch(e){console.error(e);document.getElementById('loading').innerHTML='<div><strong>ALBAMEN Cosmos</strong><span>Unable to load the game. Please refresh the page.</span></div>'}
</script>
</body>
</html>
