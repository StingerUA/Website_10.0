<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07091A">
  <title>ALBAMEN Cosmos</title>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const legacyLang = (params.get('lang') || '').toLowerCase();
      params.delete('lang');
      const query = params.toString();
      const suffix = `${query ? `?${query}` : ''}${location.hash}`;
      const targets = {
        en: '/eng/games/albamen-cosmos/en/',
        ru: '/rus/games/albamen-cosmos/ru/',
        tr: '/games/albamen-cosmos/tr/'
      };
      location.replace((targets[legacyLang] || targets.tr) + suffix);
    })();
  </script>
</head>
<body></body>
</html>
