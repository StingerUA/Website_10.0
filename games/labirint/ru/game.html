<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AR-лабиринт Alba Space</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://mixedreality.mozilla.org/ammo.js/builds/ammo.wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  <style>
    body{margin:0;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#050a1f}
    #ui-layer{position:absolute;inset:0;pointer-events:none;z-index:100;display:flex;flex-direction:column;justify-content:flex-start;padding:30px 20px;box-sizing:border-box}
    #status-message{align-self:center;background:rgba(0,255,255,.05);color:#fff;padding:16px 32px;border-radius:30px;font-size:15px;text-align:center;border:1px solid rgba(0,255,255,.4);box-shadow:0 0 15px rgba(0,255,255,.1);transition:opacity .4s ease;animation:pulse 2s infinite;margin-top:20px}
    @keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(0,255,255,.1)}50%{box-shadow:0 0 20px rgba(0,255,255,.4)}}
    #debug-console{position:absolute;bottom:10px;left:10px;width:calc(100% - 20px);height:200px;background:rgba(0,0,0,.85);color:#00ff00;font-family:monospace;font-size:12px;overflow-y:auto;padding:10px;border-radius:8px;border:1px solid #333;pointer-events:auto;box-sizing:border-box}
  </style>
  <script>
    window.onload=()=>{
      const debugConsole=document.getElementById('debug-console');
      function logDebug(msg,type='info'){
        if(!debugConsole)return;
        const line=document.createElement('div');let color='#00ff00';if(type==='error')color='#ff4444';if(type==='warn')color='#ffaa00';
        line.style.color=color;line.style.marginBottom='4px';line.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;debugConsole.appendChild(line);debugConsole.scrollTop=debugConsole.scrollHeight;
      }
      window.addEventListener('error',e=>logDebug(`ОШИБКА JS: ${e.message} (строка ${e.lineno})`,'error'));
      const scene=document.querySelector('a-scene');const marker=document.querySelector('a-marker');
      scene.addEventListener('loaded',()=>logDebug('Сцена A-Frame загружена.'));
      scene.addEventListener('camera-init',()=>logDebug('Камера успешно инициализирована.'));
      scene.addEventListener('camera-error',()=>logDebug('ОШИБКА КАМЕРЫ! Проверьте разрешение камеры в браузере.','error'));
      const checkMarker=setInterval(()=>{if(marker&&marker.object3D){logDebug(`Маркер готов к поиску. Путь: ${marker.getAttribute('url')}`);clearInterval(checkMarker)}},1000);
      marker.addEventListener('markerFound',()=>{logDebug('✅ МАРКЕР НАЙДЕН!');document.querySelector('#status-message').style.opacity='0'});
      marker.addEventListener('markerLost',()=>{logDebug('❌ Маркер потерян из виду.');document.querySelector('#status-message').style.opacity='1'});
    };
    AFRAME.registerComponent('level-manager',{schema:{startPos:{type:'vec3',default:{x:-.3,y:.05,z:-.3}}},init:function(){this.ball=document.querySelector('#player-ball');this.el.addEventListener('markerFound',()=>this.resetBall());this.el.addEventListener('markerLost',()=>{if(this.ball)this.ball.setAttribute('position','0 100 0')})},resetBall:function(){if(!this.ball||!this.ball.body)return;this.ball.setAttribute('position',this.data.startPos);const body=this.ball.body;const zeroVec=new Ammo.btVector3(0,0,0);body.setLinearVelocity(zeroVec);body.setAngularVelocity(zeroVec);body.clearForces();Ammo.destroy(zeroVec)}});
  </script>
</head>
<body>
  <div id="ui-layer"><div id="status-message">Покажите карточку лабиринта камере</div><div id="debug-console">Ожидание инициализации...<br></div></div>
  <a-scene embedded arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: true; patternRatio: 0.5;" physics="driver: ammo; debug: false; gravity: -9.8" renderer="antialias: true; alpha: true; colorManagement: true;">
    <a-assets><a-asset-item id="maze1" src="/assets/models/maze1.glb"></a-asset-item></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-sphere id="player-ball" radius="0.02" position="0 100 0" ammo-body="type: dynamic; mass: 2; friction: 0.1; restitution: 0.4" ammo-shape="type: sphere"><a-sphere radius="0.02" color="#00ffff" material="metalness: 0.9; roughness: 0.1;"></a-sphere></a-sphere>
    <a-marker type="pattern" url="/scanner/targets/render_maze1.patt" id="marker1" level-manager="startPos: -0.3 0.05 -0.3"><a-entity gltf-model="#maze1" position="0 0 0" scale="1 1 1" ammo-body="type: kinematic" ammo-shape="type: mesh"></a-entity></a-marker>
  </a-scene>
</body>
</html>
