    // ============================================================================
    // 4. WEB AUDIO SYNTHESIZER (ORIGINAL PROCEDURAL SOUND ENGINE)
    // ============================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.sfxEnabled = true;
        this.musicEnabled = false;
        this.musicInterval = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      playTone(freq, type = "sine", duration = 0.15, vol = 0.12, slideTo = null) {
        if (!this.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      playMove() {
        this.playTone(320, "sine", 0.09, 0.1, 480);
      }

      playBump() {
        this.playTone(130, "triangle", 0.12, 0.14, 90);
      }

      playCrystal() {
        this.playTone(587.33, "sine", 0.12, 0.14);
        setTimeout(() => this.playTone(880, "sine", 0.15, 0.14), 70);
        setTimeout(() => this.playTone(1174.66, "triangle", 0.28, 0.16), 140);
      }

      playAbility(element) {
        if (element === "fire") {
          this.playTone(220, "sawtooth", 0.25, 0.12, 660);
        } else if (element === "ice") {
          this.playTone(987.77, "sine", 0.18, 0.12, 1480);
          setTimeout(() => this.playTone(1318.5, "triangle", 0.22, 0.12), 90);
        } else if (element === "electric") {
          this.playTone(440, "square", 0.08, 0.1, 880);
          setTimeout(() => this.playTone(660, "square", 0.14, 0.1, 1320), 70);
        } else if (element === "nature") {
          [392, 493.88, 587.33, 783.99].forEach((f, i) =>
            setTimeout(() => this.playTone(f, "sine", 0.18, 0.11), i * 55)
          );
        } else if (element === "wind") {
          this.playTone(280, "triangle", 0.28, 0.14, 560);
        }
      }

      playVictory() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          setTimeout(() => this.playTone(n, "triangle", 0.26, 0.16), idx * 110);
        });
      }

      playClick() {
        this.playTone(520, "sine", 0.05, 0.08, 620);
      }

      toggleMusic(enable) {
        this.musicEnabled = enable;
        if (this.musicInterval) {
          clearInterval(this.musicInterval);
          this.musicInterval = null;
        }
        if (enable) {
          this.init();
          const scale = [261.63, 329.63, 392.00, 493.88, 523.25, 659.25];
          let step = 0;
          this.musicInterval = setInterval(() => {
            if (!this.musicEnabled) return;
            const f = scale[step % scale.length];
            this.playTone(f, "sine", 0.65, 0.035);
            step++;
          }, 800);
        }
      }
    }

    const sound = new SoundEngine();

    // ============================================================================
    // 5. DETERMINISTIC PUZZLE ENGINE (PURE STATE CLONING & RULES)
    // ============================================================================
    function cloneLevelState(level) {
      return {
        grid: level.grid.map(row => [...row]),
        monsters: level.monsters.map(m => ({ ...m, dir: 0 })),
        crystals: level.crystals.map(c => ({ ...c, collected: false })),
        crates: (level.crates || []).map(k => ({ ...k })),
        activeMonsterIdx: 0,
        moves: 0,
        completed: false
      };
    }

    function isGateOpen(grid) {
      // Gate 'G' opens if no unlit 'B' remains on the board
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          if (grid[r][c] === "B") return false;
        }
      }
      return true;
    }

    function isDoorOpen(state, doorCode) {
      // 'D1' opens when 'T1_ON' exists on board
      // 'D2' opens when 'T2_ON' exists OR any crate/monster is on 'P'
      if (doorCode === "D1") {
        return state.grid.some(row => row.includes("T1_ON"));
      }
      if (doorCode === "D2") {
        const t2On = state.grid.some(row => row.includes("T2_ON"));
        if (t2On) return true;
        // Check if any crate or monster stands on 'P'
        for (let r = 0; r < state.grid.length; r++) {
          for (let c = 0; c < state.grid[r].length; c++) {
            if (state.grid[r][c] === "P") {
              const hasCrate = state.crates.some(k => k.x === c && k.z === r);
              const hasMonster = state.monsters.some(m => m.x === c && m.z === r);
              if (hasCrate || hasMonster) return true;
            }
          }
        }
      }
      return false;
    }

    function canWalkOnTile(state, x, z, ignoreMonsterIdx = -1) {
      const rows = state.grid.length;
      const cols = state.grid[0].length;
      if (z < 0 || z >= rows || x < 0 || x >= cols) return false;

      // Check another monster occupying tile
      if (state.monsters.some((m, idx) => idx !== ignoreMonsterIdx && m.x === x && m.z === z)) {
        return false;
      }

      // Check crate occupying tile
      if (state.crates.some(k => k.x === x && k.z === z)) {
        return false;
      }

      const cell = state.grid[z][x];
      if (
        cell === "." ||
        cell === "F" ||        // Frozen water bridge
        cell === "V_BRIDGE" || // Grown vine bridge
        cell === "H_FILLED" || // Crate-filled pit
        cell === "P" ||        // Pressure plate
        cell === "E"           // Exit portal
      ) {
        return true;
      }
      if (cell === "G") return isGateOpen(state.grid);
      if (cell === "D1") return isDoorOpen(state, "D1");
      if (cell === "D2") return isDoorOpen(state, "D2");

      return false;
    }

    // ============================================================================
    // 6. THREE.JS 3D BOARD & PROCEDURAL MONSTER RENDERER COMPONENT
    // ============================================================================
    function ThreePuzzleCanvas({
      levelState,
      onTileClick,
      onMonsterSelect,
      showGuides,
      effectEvent,
      cameraZoom
    }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const boardGroupRef = useRef(null);
      const monsterMeshesRef = useRef({});
      const crystalMeshesRef = useRef([]);
      const crateMeshesRef = useRef([]);
      const portalMeshRef = useRef(null);
      const particlesRef = useRef([]);
      const clickTargetsRef = useRef([]);

      // Helper: create cute procedural 3D monster mesh matching the 5 elemental heroes
      const buildMonsterMesh = useCallback((monsterId) => {
        const group = new THREE.Group();
        const mInfo = MONSTERS[monsterId] || MONSTERS.flamo;
        const mainMat = new THREE.MeshStandardMaterial({
          color: mInfo.color,
          roughness: 0.35,
          metalness: 0.1
        });
        const accentMat = new THREE.MeshStandardMaterial({
          color: mInfo.accent,
          emissive: mInfo.color,
          emissiveIntensity: 0.35,
          roughness: 0.25
        });

        // Body
        const bodyGeo = new THREE.SphereGeometry(0.34, 24, 24);
        const body = new THREE.Mesh(bodyGeo, mainMat);
        body.scale.set(1, 0.92, 0.95);
        body.position.y = 0.36;
        body.castShadow = true;
        group.add(body);

        // Belly patch
        const bellyGeo = new THREE.SphereGeometry(0.24, 16, 16);
        const belly = new THREE.Mesh(bellyGeo, accentMat);
        belly.position.set(0, 0.32, 0.16);
        belly.scale.set(0.85, 0.78, 0.5);
        group.add(belly);

        // Big expressive eyes
        const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
        const sparkleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        [-0.12, 0.12].forEach((ex) => {
          const eyeGroup = new THREE.Group();
          eyeGroup.position.set(ex, 0.45, 0.28);

          const eyeW = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 16), eyeWhiteMat);
          eyeW.scale.set(1, 1.1, 0.6);
          eyeGroup.add(eyeW);

          const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 12), pupilMat);
          pupil.position.set(0, 0, 0.035);
          eyeGroup.add(pupil);

          const spark = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), sparkleMat);
          spark.position.set(0.02, 0.025, 0.075);
          eyeGroup.add(spark);

          group.add(eyeGroup);
        });

        // Cute feet
        [-0.14, 0.14].forEach((fx) => {
          const foot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), mainMat);
          foot.scale.set(1, 0.6, 1.3);
          foot.position.set(fx, 0.07, 0.05);
          group.add(foot);
        });

        // Elemental signature features
        if (monsterId === "flamo") {
          // Two cute horns + flame tail
          const hornGeo = new THREE.ConeGeometry(0.06, 0.18, 12);
          [-0.16, 0.16].forEach((hx, i) => {
            const horn = new THREE.Mesh(hornGeo, accentMat);
            horn.position.set(hx, 0.68, 0);
            horn.rotation.z = i === 0 ? 0.35 : -0.35;
            group.add(horn);
          });
          const tail = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.26, 12), accentMat);
          tail.position.set(0, 0.3, -0.34);
          tail.rotation.x = -0.8;
          group.add(tail);
        } else if (monsterId === "frosty") {
          // Crystal ears & crown shard
          const shardGeo = new THREE.OctahedronGeometry(0.11, 0);
          [-0.22, 0, 0.22].forEach((sx, idx) => {
            const shard = new THREE.Mesh(shardGeo, accentMat);
            shard.position.set(sx, idx === 1 ? 0.74 : 0.64, 0);
            shard.scale.set(0.7, 1.3, 0.7);
            group.add(shard);
          });
        } else if (monsterId === "volt") {
          // Lightning antennae
          const antGeo = new THREE.CylinderGeometry(0.025, 0.04, 0.26, 8);
          [-0.14, 0.14].forEach((ax, i) => {
            const ant = new THREE.Mesh(antGeo, accentMat);
            ant.position.set(ax, 0.72, 0);
            ant.rotation.z = i === 0 ? 0.3 : -0.3;
            const tip = new THREE.Mesh(new THREE.OctahedronGeometry(0.07, 0), accentMat);
            tip.position.set(0, 0.14, 0);
            ant.add(tip);
            group.add(ant);
          });
        } else if (monsterId === "buddy") {
          // Leaf ears & tiny flower on top
          const leafGeo = new THREE.SphereGeometry(0.12, 12, 12);
          [-0.22, 0.22].forEach((lx, i) => {
            const leaf = new THREE.Mesh(leafGeo, accentMat);
            leaf.scale.set(1.4, 0.35, 0.8);
            leaf.position.set(lx, 0.64, 0);
            leaf.rotation.z = i === 0 ? 0.5 : -0.5;
            group.add(leaf);
          });
          const flower = new THREE.Mesh(
            new THREE.SphereGeometry(0.075, 12, 12),
            new THREE.MeshBasicMaterial({ color: 0xf472b6 })
          );
          flower.position.set(0, 0.72, 0);
          group.add(flower);
        } else if (monsterId === "puff") {
          // Fluffy cloud puffs around body + floating ears
          const puffPositions = [
            [-0.24, 0.38, 0],
            [0.24, 0.38, 0],
            [0, 0.58, -0.12],
            [-0.18, 0.68, 0],
            [0.18, 0.68, 0]
          ];
          puffPositions.forEach(([px, py, pz]) => {
            const p = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 14), accentMat);
            p.position.set(px, py, pz);
            group.add(p);
          });
        }

        // Selection ring under active monster
        const ringGeo = new THREE.RingGeometry(0.36, 0.45, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.0
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.03;
        ring.name = "selectionRing";
        group.add(ring);

        return group;
      }, []);

      // Initialize Three.js Scene
      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        sceneRef.current = scene;

        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || window.innerHeight;
        const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.innerHTML = "";
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e1b4b, 0.85);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
        dirLight.position.set(6, 12, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const boardGroup = new THREE.Group();
        scene.add(boardGroup);
        boardGroupRef.current = boardGroup;

        // Animation Loop
        let frameId;
        const clock = new THREE.Clock();

        const animate = () => {
          frameId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          // Animate Monsters (smooth lerp position + idle bounce)
          Object.values(monsterMeshesRef.current).forEach((mObj, idx) => {
            if (!mObj || !mObj.mesh) return;
            mObj.mesh.position.x += (mObj.targetX - mObj.mesh.position.x) * 0.22;
            mObj.mesh.position.z += (mObj.targetZ - mObj.mesh.position.z) * 0.22;
            const hopDist = Math.hypot(
              mObj.targetX - mObj.mesh.position.x,
              mObj.targetZ - mObj.mesh.position.z
            );
            const hopHeight = Math.sin(Math.min(hopDist * Math.PI, Math.PI)) * 0.35;
            const idleBounce = Math.sin(t * 4 + idx) * 0.035;
            mObj.mesh.position.y = Math.max(0, hopHeight + idleBounce);

            // Pulse active selection ring
            const ring = mObj.mesh.getObjectByName("selectionRing");
            if (ring) {
              ring.material.opacity = mObj.isActive ? 0.65 + Math.sin(t * 6) * 0.25 : 0.0;
              ring.scale.setScalar(mObj.isActive ? 1 + Math.sin(t * 5) * 0.06 : 1);
            }
          });

          // Animate Crystals
          crystalMeshesRef.current.forEach((cMesh, i) => {
            if (cMesh && cMesh.visible) {
              cMesh.rotation.y = t * 2.2 + i;
              cMesh.position.y = 0.45 + Math.sin(t * 3.5 + i) * 0.08;
            }
          });

          // Animate Crates smooth slide
          crateMeshesRef.current.forEach((kObj) => {
            if (kObj && kObj.mesh) {
              kObj.mesh.position.x += (kObj.targetX - kObj.mesh.position.x) * 0.25;
              kObj.mesh.position.z += (kObj.targetZ - kObj.mesh.position.z) * 0.25;
            }
          });

          // Animate Exit Portal Vortex
          if (portalMeshRef.current) {
            portalMeshRef.current.rotation.z = t * 2.5;
            const scalePulse = 1 + Math.sin(t * 4) * 0.07;
            portalMeshRef.current.scale.set(scalePulse, scalePulse, 1);
          }

          // Animate transient ability particles
          for (let i = particlesRef.current.length - 1; i >= 0; i--) {
            const p = particlesRef.current[i];
            p.life -= 0.035;
            p.mesh.position.add(p.vel);
            p.mesh.scale.setScalar(Math.max(0.01, p.life));
            if (p.life <= 0) {
              boardGroup.remove(p.mesh);
              particlesRef.current.splice(i, 1);
            }
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!container || !rendererRef.current || !cameraRef.current) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          cameraRef.current.aspect = w / h;
          cameraRef.current.updateProjectionMatrix();
          rendererRef.current.setSize(w, h);
        };
        window.addEventListener("resize", handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener("resize", handleResize);
          renderer.dispose();
        };
      }, []);

      // Spawn particle burst when ability or crystal collection triggers
      useEffect(() => {
        if (!effectEvent || !boardGroupRef.current) return;
        const { x, z, color } = effectEvent;
        const rows = levelState.grid.length;
        const cols = levelState.grid[0].length;
        const wx = x - (cols - 1) / 2;
        const wz = z - (rows - 1) / 2;

        for (let i = 0; i < 18; i++) {
          const geo = new THREE.OctahedronGeometry(0.09, 0);
          const mat = new THREE.MeshBasicMaterial({ color: color || 0x38bdf8 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(wx, 0.4, wz);
          const angle = (Math.PI * 2 * i) / 18;
          const speed = 0.04 + Math.random() * 0.05;
          const vel = new THREE.Vector3(
            Math.cos(angle) * speed,
            0.03 + Math.random() * 0.05,
            Math.sin(angle) * speed
          );
          boardGroupRef.current.add(mesh);
          particlesRef.current.push({ mesh, vel, life: 1.0 });
        }
      }, [effectEvent]);

      // Rebuild / Update 3D Board whenever levelState changes
      useEffect(() => {
        const boardGroup = boardGroupRef.current;
        const camera = cameraRef.current;
        if (!boardGroup || !camera || !levelState) return;

        const rows = levelState.grid.length;
        const cols = levelState.grid[0].length;

        // Adjust Camera to frame board nicely on both portrait phones and desktop
        const aspect = camera.aspect || 1;
        const maxDim = Math.max(cols, rows);
        const portraitBoost = aspect < 0.85 ? 1.38 : 1.05;
        const dist = maxDim * 1.18 * portraitBoost * (cameraZoom || 1);
        camera.position.set(0, dist * 0.92, dist * 0.76);
        camera.lookAt(0, -0.2, 0.2);

        // Clear static board tiles while preserving smooth monster meshes
        const toRemove = [];
        boardGroup.children.forEach((ch) => {
          if (!ch.userData?.isMonster && !ch.userData?.isParticle) {
            toRemove.push(ch);
          }
        });
        toRemove.forEach((ch) => boardGroup.remove(ch));
        clickTargetsRef.current = [];
        crystalMeshesRef.current = [];
        crateMeshesRef.current = [];

        const activeMonster = levelState.monsters[levelState.activeMonsterIdx];
        const allCrystalsCollected = levelState.crystals.every((c) => c.collected);

        // Build Tiles
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cell = levelState.grid[r][c];
            const wx = c - (cols - 1) / 2;
            const wz = r - (rows - 1) / 2;

            // Base tile
            let tileColor = (r + c) % 2 === 0 ? 0x34d399 : 0x10b981;
            let tileHeight = 0.24;
            let tileY = -0.12;

            if (cell === "W") {
              tileColor = 0x334155;
            } else if (cell === "~") {
              tileColor = 0x0284c7;
              tileHeight = 0.16;
              tileY = -0.16;
            } else if (cell === "F") {
              tileColor = 0x7dd3fc;
            } else if (cell === "V" || cell === "H") {
              tileColor = 0x0f172a;
              tileHeight = 0.06;
              tileY = -0.22;
            } else if (cell === "V_BRIDGE") {
              tileColor = 0x22c55e;
            } else if (cell === "H_FILLED") {
              tileColor = 0xb45309;
            }

            const tileGeo = new THREE.BoxGeometry(0.94, tileHeight, 0.94);
            const tileMat = new THREE.MeshStandardMaterial({
              color: tileColor,
              roughness: cell === "F" || cell === "~" ? 0.15 : 0.65,
              metalness: cell === "F" ? 0.3 : 0.08
            });
            const tileMesh = new THREE.Mesh(tileGeo, tileMat);
            tileMesh.position.set(wx, tileY, wz);
            tileMesh.receiveShadow = true;
            tileMesh.userData = { gridX: c, gridZ: r };
            boardGroup.add(tileMesh);
            clickTargetsRef.current.push(tileMesh);

            // Highlight valid adjacent moves for active monster
            if (showGuides && activeMonster) {
              const distMan = Math.abs(activeMonster.x - c) + Math.abs(activeMonster.z - r);
              if (distMan === 1 && canWalkOnTile(levelState, c, r, levelState.activeMonsterIdx)) {
                const guideGeo = new THREE.RingGeometry(0.18, 0.28, 24);
                const guideMat = new THREE.MeshBasicMaterial({
                  color: 0xfef08a,
                  side: THREE.DoubleSide,
                  transparent: true,
                  opacity: 0.75
                });
                const guide = new THREE.Mesh(guideGeo, guideMat);
                guide.rotation.x = -Math.PI / 2;
                guide.position.set(wx, 0.02, wz);
                boardGroup.add(guide);
              }
            }

            // Special Environmental Objects on Tile
            if (cell === "W") {
              // Stylized rounded rock wall + occasional alien mushroom/tree on border
              const wallGeo = new THREE.BoxGeometry(0.88, 0.55, 0.88);
              const wallMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.7 });
              const wall = new THREE.Mesh(wallGeo, wallMat);
              wall.position.set(wx, 0.26, wz);
              wall.castShadow = true;
              wall.receiveShadow = true;
              boardGroup.add(wall);

              if ((r + c) % 3 === 0) {
                const cap = new THREE.Mesh(
                  new THREE.SphereGeometry(0.22, 12, 12),
                  new THREE.MeshStandardMaterial({
                    color: 0xa855f7,
                    emissive: 0x7e22ce,
                    emissiveIntensity: 0.35
                  })
                );
                cap.scale.set(1, 0.55, 1);
                cap.position.set(wx, 0.62, wz);
                boardGroup.add(cap);
              }
            } else if (cell === "I") {
              // Translucent Ice Block
              const iceGeo = new THREE.BoxGeometry(0.78, 0.72, 0.78);
              const iceMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                emissive: 0x0284c7,
                emissiveIntensity: 0.25,
                transparent: true,
                opacity: 0.82,
                roughness: 0.1
              });
              const ice = new THREE.Mesh(iceGeo, iceMat);
              ice.position.set(wx, 0.36, wz);
              ice.castShadow = true;
              ice.userData = { gridX: c, gridZ: r };
              boardGroup.add(ice);
              clickTargetsRef.current.push(ice);
            } else if (cell === "B" || cell === "B_LIT") {
              // Fire Brazier
              const ped = new THREE.Mesh(
                new THREE.CylinderGeometry(0.28, 0.35, 0.36, 16),
                new THREE.MeshStandardMaterial({ color: 0x78350f })
              );
              ped.position.set(wx, 0.18, wz);
              boardGroup.add(ped);

              if (cell === "B_LIT") {
                const flame = new THREE.Mesh(
                  new THREE.ConeGeometry(0.22, 0.48, 12),
                  new THREE.MeshBasicMaterial({ color: 0xff6b1a })
                );
                flame.position.set(wx, 0.52, wz);
                boardGroup.add(flame);
              }
            } else if (cell === "G") {
              const open = isGateOpen(levelState.grid);
              if (!open) {
                const gate = new THREE.Mesh(
                  new THREE.BoxGeometry(0.85, 0.65, 0.22),
                  new THREE.MeshStandardMaterial({
                    color: 0xf97316,
                    emissive: 0xea580c,
                    emissiveIntensity: 0.4
                  })
                );
                gate.position.set(wx, 0.32, wz);
                boardGroup.add(gate);
              }
            } else if (cell.startsWith("T")) {
              // Electric Tesla Coil
              const powered = cell.endsWith("_ON");
              const coil = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18, 0.28, 0.55, 16),
                new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.6 })
              );
              coil.position.set(wx, 0.28, wz);
              const orb = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 16, 16),
                new THREE.MeshBasicMaterial({ color: powered ? 0xfacc15 : 0x475569 })
              );
              orb.position.set(0, 0.34, 0);
              coil.add(orb);
              boardGroup.add(coil);
            } else if (cell === "D1" || cell === "D2") {
              const open = isDoorOpen(levelState, cell);
              if (!open) {
                const doorColor = cell === "D1" ? 0x38bdf8 : 0xc084fc;
                const laser = new THREE.Mesh(
                  new THREE.BoxGeometry(0.86, 0.58, 0.16),
                  new THREE.MeshBasicMaterial({
                    color: doorColor,
                    transparent: true,
                    opacity: 0.72
                  })
                );
                laser.position.set(wx, 0.3, wz);
                boardGroup.add(laser);
              }
            } else if (cell === "V") {
              // Spore markers floating in chasm
              const spore = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 10, 10),
                new THREE.MeshBasicMaterial({ color: 0x4ade80 })
              );
              spore.position.set(wx, 0.12, wz);
              boardGroup.add(spore);
            } else if (cell === "P") {
              // Pressure Plate
              const plate = new THREE.Mesh(
                new THREE.CylinderGeometry(0.32, 0.35, 0.08, 20),
                new THREE.MeshStandardMaterial({
                  color: 0xc084fc,
                  emissive: 0x9333ea,
                  emissiveIntensity: 0.35
                })
              );
              plate.position.set(wx, 0.04, wz);
              boardGroup.add(plate);
            } else if (cell === "E") {
              // Exit Portal (ALBA Space Ring style)
              const portalGroup = new THREE.Group();
              portalGroup.position.set(wx, 0.42, wz);
              const torus = new THREE.Mesh(
                new THREE.TorusGeometry(0.34, 0.06, 16, 32),
                new THREE.MeshBasicMaterial({
                  color: allCrystalsCollected ? 0x38bdf8 : 0x64748b
                })
              );
              portalGroup.add(torus);
              if (allCrystalsCollected) {
                const inner = new THREE.Mesh(
                  new THREE.CircleGeometry(0.29, 24),
                  new THREE.MeshBasicMaterial({
                    color: 0x60a5fa,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.65
                  })
                );
                portalGroup.add(inner);
              }
              portalMeshRef.current = portalGroup;
              boardGroup.add(portalGroup);
            }
          }
        }

        // Build Crystals
        levelState.crystals.forEach((cr) => {
          if (cr.collected) return;
          const wx = cr.x - (cols - 1) / 2;
          const wz = cr.z - (rows - 1) / 2;
          const cGeo = new THREE.OctahedronGeometry(0.24, 0);
          const cMat = new THREE.MeshStandardMaterial({
            color: 0x38bdf8,
            emissive: 0x0284c7,
            emissiveIntensity: 0.6,
            roughness: 0.1,
            metalness: 0.3
          });
          const cMesh = new THREE.Mesh(cGeo, cMat);
          cMesh.scale.set(0.85, 1.35, 0.85);
          cMesh.position.set(wx, 0.45, wz);
          cMesh.castShadow = true;
          boardGroup.add(cMesh);
          crystalMeshesRef.current.push(cMesh);
        });

        // Build Movable Crates
        levelState.crates.forEach((kr) => {
          const wx = kr.x - (cols - 1) / 2;
          const wz = kr.z - (rows - 1) / 2;
          const kGeo = new THREE.BoxGeometry(0.68, 0.68, 0.68);
          const kMat = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            roughness: 0.45
          });
          const kMesh = new THREE.Mesh(kGeo, kMat);
          kMesh.position.set(wx, 0.34, wz);
          kMesh.castShadow = true;
          kMesh.userData = { gridX: kr.x, gridZ: kr.z };
          boardGroup.add(kMesh);
          clickTargetsRef.current.push(kMesh);
          crateMeshesRef.current.push({ mesh: kMesh, targetX: wx, targetZ: wz });
        });

        // Sync or Create Monster Meshes
        const activeIds = new Set(levelState.monsters.map((m) => m.id));
        Object.keys(monsterMeshesRef.current).forEach((id) => {
          if (!activeIds.has(id)) {
            boardGroup.remove(monsterMeshesRef.current[id].mesh);
            delete monsterMeshesRef.current[id];
          }
        });

        levelState.monsters.forEach((m, idx) => {
          const wx = m.x - (cols - 1) / 2;
          const wz = m.z - (rows - 1) / 2;
          if (!monsterMeshesRef.current[m.id]) {
            const mesh = buildMonsterMesh(m.id);
            mesh.position.set(wx, 0, wz);
            mesh.userData = { isMonster: true, monsterIdx: idx };
            boardGroup.add(mesh);
            monsterMeshesRef.current[m.id] = {
              mesh,
              targetX: wx,
              targetZ: wz,
              isActive: idx === levelState.activeMonsterIdx
            };
          } else {
            const mObj = monsterMeshesRef.current[m.id];
            mObj.targetX = wx;
            mObj.targetZ = wz;
            mObj.isActive = idx === levelState.activeMonsterIdx;
            mObj.mesh.userData.monsterIdx = idx;
          }
        });
      }, [levelState, showGuides, cameraZoom, buildMonsterMesh]);

      // Pointer / Touch Raycasting & Swipe Handler
      const pointerDownRef = useRef(null);

      const handlePointerDown = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        pointerDownRef.current = { x: clientX, y: clientY };
      };

      const handlePointerUp = (e) => {
        if (!pointerDownRef.current) return;
        const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        const dx = clientX - pointerDownRef.current.x;
        const dy = clientY - pointerDownRef.current.y;
        pointerDownRef.current = null;

        // If user swiped noticeably, move in swipe direction
        if (Math.hypot(dx, dy) > 36) {
          if (Math.abs(dx) > Math.abs(dy)) {
            onTileClick(dx > 0 ? "RIGHT" : "LEFT", null);
          } else {
            onTileClick(dy > 0 ? "DOWN" : "UP", null);
          }
          return;
        }

        // Otherwise raycast tap on 3D board
        const container = mountRef.current;
        const camera = cameraRef.current;
        if (!container || !camera) return;

        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(
          ((clientX - rect.left) / rect.width) * 2 - 1,
          -((clientY - rect.top) / rect.height) * 2 + 1
        );
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);

        // Check if tapped directly on a monster to switch active monster
        const monsterRootMeshes = Object.values(monsterMeshesRef.current).map((o) => o.mesh);
        const mHits = raycaster.intersectObjects(monsterRootMeshes, true);
        if (mHits.length > 0) {
          let obj = mHits[0].object;
          while (obj && !obj.userData?.isMonster) obj = obj.parent;
          if (obj && typeof obj.userData?.monsterIdx === "number") {
            onMonsterSelect(obj.userData.monsterIdx);
            return;
          }
        }

        // Check tile tap
        const hits = raycaster.intersectObjects(clickTargetsRef.current, false);
        if (hits.length > 0) {
          const { gridX, gridZ } = hits[0].object.userData;
          if (typeof gridX === "number" && typeof gridZ === "number") {
            onTileClick(null, { x: gridX, z: gridZ });
          }
        }
      };

      return (
        <div
          ref={mountRef}
          onMouseDown={handlePointerDown}
          onMouseUp={handlePointerUp}
          onTouchStart={handlePointerDown}
          onTouchEnd={handlePointerUp}
          className="w-full h-full cursor-pointer touch-none"
        />
      );
    }

    function App() {
      const [lang, setLang] = useState(() => {

      const unlockedLevel = Math.min(LEVELS.length, 1 + progressCount);
      const isDaily = Boolean(level.isDaily);
      const levelKey = isDaily ? `daily-${level.dateStr}` : String(level.id);
      const remaining = levelState.crystals.filter(c => !c.collected).length;
      const active = levelState.monsters[levelState.activeMonsterIdx];
      const activeInfo = MONSTERS[active?.id] || MONSTERS.flamo;
      const reachedBest = progress.stars[levelKey] || 0;

      useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (_) {} }, [progress]);

      const launch = useCallback((nextLevel) => {

      }, []);
      const goMenu = () => { sound.playClick(); setModal(null); setView("menu"); };
      const changeView = (next) => { sound.playClick(); setModal(null); setView(next); };

      function performMove(direction, clickedTile) {
        if (modal || levelState.completed || view !== "game") return;
        const current = levelState;
        const monster = current.monsters[current.activeMonsterIdx];
        if (!monster) return;
        let dx = 0, dz = 0;
        if (direction === "LEFT") dx = -1;
        else if (direction === "RIGHT") dx = 1;
        else if (direction === "UP") dz = -1;
        else if (direction === "DOWN") dz = 1;
        else if (clickedTile) {
          dx = clickedTile.x - monster.x;
          dz = clickedTile.z - monster.z;
        }
        if (Math.abs(dx) + Math.abs(dz) !== 1) return;
        const x = monster.x + dx, z = monster.z + dz;
        if (!canWalkOnTile(current, x, z, current.activeMonsterIdx)) { sound.playBump(); return; }
        const next = copyState(current);
        next.monsters[next.activeMonsterIdx].x = x;
        next.monsters[next.activeMonsterIdx].z = z;
        next.moves++;
        let pickedUp = false;
        next.crystals.forEach(c => { if (!c.collected && c.x === x && c.z === z) { c.collected = true; pickedUp = true; } });
        const clear = next.crystals.every(c => c.collected);
        if (clear && next.grid[z][x] === "E") next.completed = true;
        setHistory(old => [...old.slice(-79), current]);
        setLevelState(next);
        if (pickedUp) { sound.playCrystal(); setEffectEvent({ x, z, color: 0x38bdf8, at: Date.now() }); }
        else sound.playMove();
        setMessage("");
      }

      function useAbility() {
        if (modal || levelState.completed || view !== "game") return;
        const current = levelState;
        const m = current.monsters[current.activeMonsterIdx];
        const next = copyState(current);
        const element = MONSTERS[m.id]?.element;
        let hit = false;
        let burst = { x: m.x, z: m.z, color: MONSTERS[m.id]?.color || "#38bdf8", at: Date.now() };
        for (const [dx,dz] of neighbours) {
          const x = m.x + dx, z = m.z + dz;
          const cell = next.grid[z]?.[x];
          if (!cell) continue;
          if (element === "fire" && cell === "I") { next.grid[z][x] = "."; hit = true; }
          else if (element === "fire" && cell === "B") { next.grid[z][x] = "B_LIT"; hit = true; }
          else if (element === "ice" && cell === "~") { next.grid[z][x] = "F"; hit = true; }
          else if (element === "nature" && cell === "V") { next.grid[z][x] = "V_BRIDGE"; hit = true; }
          else if (element === "electric" && (cell === "T1" || cell === "T2")) { next.grid[z][x] = cell + "_ON"; hit = true; }
          else if (element === "wind") {
            const k = next.crates.findIndex(c => c.x === x && c.z === z);
            if (k >= 0) {
              let cx = x, cz = z;
              let moved = false;
              // A gust pushes until a pressure plate, a filled pit, or the last safe square.
              for (let step=0; step<12; step++) {
                const nx = cx + dx, nz = cz + dz;
                const target = next.grid[nz]?.[nx];
                if (target === "H") {
                  next.grid[nz][nx] = "H_FILLED";
                  next.crates.splice(k, 1);
                  moved = true;
                  break;
                }
                if (!canWalkOnTile(next, nx, nz)) break;
                if (next.crates.some((c, i) => i !== k && c.x === nx && c.z === nz)) break;
                cx = nx; cz = nz; moved = true;
                next.crates[k].x = cx;
                next.crates[k].z = cz;
                if (target === "P") break;
              }
              if (moved) hit = true;
            }
          }
        }
        if (!hit) { sound.playBump(); setMessage(u.noAbility); return; }
        next.moves++;
        setHistory(old => [...old.slice(-79), current]);
        setLevelState(next);
        setEffectEvent(burst);
        sound.playAbility(element);
        setMessage("");
      }

        if (modal || levelState.completed || view !== "game") return;
        if (index < 0 || index >= levelState.monsters.length) return;

            wallet: prev.wallet + walletReward,

        sound.playVictory();

          if (keys[event.key]) performMove(keys[event.key], null);

          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") { event.preventDefault(); undoMove(); }

        </header>
      );
      const button = (label, onClick, icon, extra = "") => <button onClick={onClick} className={`btn-3d rounded-2xl border border-sky-300/30 bg-gradient-to-r from-sky-500 to-blue-700 px-5 py-3 font-extrabold shadow-lg shadow-sky-900/30 hover:brightness-110 ${extra}`}>{icon ? `${icon}  ` : ""}{label}</button>;
      const backButton = (target="menu") => <button className="rounded-lg border border-slate-500/50 px-3 py-2 text-sm font-bold hover:bg-slate-800" onClick={() => changeView(target)}>← {u.back}</button>;

      return (
        <div className="w-full h-full flex flex-col overflow-hidden">
          {header}
          {view === "menu" && <main className="flex-1 overflow-y-auto p-4 md:p-8 flex justify-center">
            <div className="w-full max-w-5xl grid md:grid-cols-2 gap-8 items-center">
              <section className="flex flex-col gap-5 py-8">
                <div className="inline-flex self-start rounded-full bg-sky-500/15 border border-sky-400/40 px-4 py-2 text-xs font-black tracking-widest text-sky-200">🪐 {t.universe}</div>
                <h1 className="font-title text-5xl md:text-7xl font-bold leading-tight drop-shadow-2xl">MONSTER <span className="text-cyan-300">PUZZLE</span></h1>
                <p className="text-2xl font-title text-white/90">{t.subtitle}</p>
                <p className="text-slate-300 text-sm md:text-base max-w-xl">{u.crystalHint} 🔥 ❄️ ⚡ 🌿 🌪️</p>
                <div className="flex flex-wrap gap-3">{button(t.play, () => launch(LEVELS[Math.min(progressCount, LEVELS.length-1)]), "🚀")}{button(t.dailyBtn, () => launch(getDailyChallengeLevel()), "🌠", "!bg-gradient-to-r !from-violet-600 !to-indigo-800")}</div>
                <div className="grid grid-cols-2 gap-3 text-sm">{[["🗺️", t.levelsBtn, "levels"],["📖",t.collectionBtn,"collection"],["🧪",t.labBtn,"lab"],["⚙️",t.settingsBtn,"settings"]].map(([icon,text,page]) => <button key={page} onClick={() => changeView(page)} className="glass-panel rounded-2xl px-4 py-4 text-left font-bold hover:border-sky-300/60">{icon} {text}</button>)}</div>
                <div className="text-xs text-slate-400">{u.localSave} · {u.free}</div>
              </section>
              <section className="glass-panel rounded-[32px] p-7 flex flex-col items-center gap-6 animate-float">
                <div className="text-center"><div className="font-title text-2xl font-bold">🌌 ALBARIS</div><div className="text-sky-200 text-sm">{t.world1}</div></div>
                <div className="grid grid-cols-3 gap-3 w-full max-w-sm">{Object.values(MONSTERS).map((m,i) => <div key={m.id} className="aspect-square flex items-center justify-center rounded-3xl shadow-xl border border-white/20 text-5xl" style={{ background: `radial-gradient(circle at 35% 25%,${m.color}bb, #1e293b)` }}>{m.icon}</div>)}</div>
                <div className="flex gap-5 font-black text-lg"><span>⭐ {Object.values(progress.stars).reduce((a,b)=>a+b,0)}</span><span>💎 {progress.wallet}</span><span>🏆 {progressCount}/8</span></div>
                <p className="text-sm text-center text-slate-300">{t.laraGuideTitle} • {t.albamenAiTitle}</p>
              </section>
            </div>
          </main>}
          {view === "levels" && <main className="flex-1 overflow-y-auto p-4 md:p-8"><div className="max-w-6xl mx-auto">
            <div className="flex justify-between items-center gap-3 mb-5">{backButton()}<h2 className="font-title text-xl md:text-3xl font-bold">🗺️ {u.levels}</h2><span className="text-sm text-sky-200">{progressCount}/8</span></div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">{LEVELS.map(l => { const locked = l.id > unlockedLevel; const earned = progress.stars[l.id] || 0; return <button disabled={locked} key={l.id} onClick={()=>launch(l)} className={`glass-panel text-left rounded-3xl p-5 min-h-[165px] flex flex-col justify-between ${locked ? "opacity-55 cursor-not-allowed" : "hover:border-cyan-300"}`}><div className="flex justify-between"><span className="text-3xl">{locked ? "🔒" : ["🔥","❄️","🔥","⚡","🌿","🌪️","🪐","🏆"][l.id-1]}</span><strong className="text-cyan-300">#{String(l.id).padStart(2,"0")}</strong></div><div className="font-title font-bold mt-3">{l.title[lang]}</div><div className="text-xs text-slate-300 mt-1">{l.subtitle[lang]}</div><div className="text-yellow-300 mt-3 tracking-widest">{earned ? "★".repeat(earned) + "☆".repeat(3-earned) : "☆☆☆"}</div></button> })}</div>
          </div></main>}
          {view === "collection" && <main className="flex-1 overflow-y-auto p-4 md:p-8"><div className="max-w-6xl mx-auto"><div className="flex gap-4 items-center mb-6">{backButton()}<h2 className="font-title text-xl md:text-3xl">📖 {t.collectionBtn}</h2></div><p className="text-slate-300 mb-5">{u.collectionDesc}</p>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{Object.values(MONSTERS).map(m => <article key={m.id} className="glass-panel rounded-2xl p-5"><div className="text-6xl mb-2">{m.icon}</div><h3 className="font-title text-xl font-bold" style={{color:m.accent}}>{m.name[lang]}</h3><p className="text-xs text-slate-300 mb-3">{m.title[lang]} • {m.abilityName[lang]}</p><p className="text-sm text-slate-100 mb-3">{m.desc[lang]}</p><p className="text-xs text-cyan-200">{m.scienceNote[lang]}</p></article>)}</div>
            <h3 className="font-title mt-8 text-xl mb-3">ALBA-DEX — 60</h3><div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">{EXTRA_SHEET_MONSTERS.map((m,i)=><div key={i} className="glass-panel rounded-xl p-4"><div className="font-bold" style={{color:m.color}}>{m.name}</div><p className="text-xs text-slate-400 mt-1">{m.code} · {m.element}</p><p className="text-xs text-slate-300 mt-2">{m.desc}</p></div>)}</div><p className="text-xs text-slate-400 mt-3">5 + {EXTRA_SHEET_MONSTERS.length} / 60</p>
          </div></main>}
          {view === "lab" && <main className="flex-1 overflow-y-auto p-4 md:p-8"><div className="max-w-4xl mx-auto"><div className="flex items-center justify-between gap-3 mb-6">{backButton()}<h2 className="font-title text-xl md:text-2xl">🧪 {t.labBtn}</h2><span className="text-cyan-200 font-bold">💎 {progress.wallet}</span></div><p className="text-slate-300 mb-6">{u.labDesc}</p><div className="grid md:grid-cols-2 gap-4">{LAB_ITEMS.map(item => {const installed=progress.installed.includes(item.id);return <div key={item.id} className="glass-panel rounded-2xl p-5 flex items-center justify-between gap-3"><div><div className="text-4xl mb-2">{item.icon}</div><h3 className="font-bold">{item.name[lang]}</h3><p className="text-cyan-300">💎 {item.cost}</p></div><button disabled={installed || progress.wallet < item.cost} className="rounded-xl bg-sky-600 px-4 py-3 font-bold disabled:opacity-50" onClick={()=>setProgress(p=>({...p,wallet:p.wallet-item.cost,installed:[...p.installed,item.id]}))}>{installed ? t.installed : t.buy}</button></div>})}</div></div></main>}
          {view === "settings" && <main className="flex-1 overflow-y-auto p-5 md:p-8"><div className="max-w-xl mx-auto">{backButton()}<h2 className="font-title text-3xl mt-5 mb-5">⚙️ {t.settingsBtn}</h2><p className="text-slate-300 mb-5">{u.settingsDesc}</p><div className="glass-panel rounded-3xl p-6 space-y-5"><label className="flex items-center justify-between gap-5"><span>{t.soundFx}</span><input type="checkbox" checked={sfx} onChange={e=>setSfx(e.target.checked)} className="h-5 w-5" /></label><label className="flex items-center justify-between gap-5"><span>{t.music}</span><input type="checkbox" checked={music} onChange={e=>setMusic(e.target.checked)} className="h-5 w-5" /></label><label className="flex items-center justify-between gap-5"><span>{t.highContrast}</span><input type="checkbox" checked={showGuides} onChange={e=>setShowGuides(e.target.checked)} className="h-5 w-5" /></label><hr className="border-white/10" /><p className="font-bold text-sky-200">💾 {u.localTitle}</p><p className="text-sm">{u.localSave}</p><p className="text-xs text-slate-400">{u.localNotice}</p></div></div></main>}
          {view === "game" && <main className="flex-1 min-h-0 flex flex-col">
            <div className="flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-slate-900/70 border-b border-white/10">
              <button onClick={()=>setModal("pause")} className="rounded-xl border border-white/20 px-3 py-2 font-extrabold text-sm">☰ {t.pauseTitle}</button>
              <span className="font-title text-sm sm:text-lg font-bold truncate">{level.title[lang]}</span>
              <div className="flex items-center gap-3 text-xs sm:text-sm font-bold"><span>💎 {levelState.crystals.length-remaining}/{levelState.crystals.length}</span><span>👣 {levelState.moves}</span><span>🎯 {level.parMoves}</span></div>
            </div>
            <div className="relative flex-1 min-h-[170px] overflow-hidden bg-[radial-gradient(ellipse_at_center,#273a74_0%,#0b1230_60%,#050714_100%)]">
              <ThreePuzzleCanvas levelState={levelState} onTileClick={performMove} onMonsterSelect={selectMonster} showGuides={showGuides} effectEvent={effectEvent} cameraZoom={1} />
              <div className="pointer-events-none absolute top-2 left-2 rounded-xl bg-slate-950/70 px-3 py-2 text-xs text-cyan-100 max-w-[220px]">{remaining ? t.portalClosed : t.portalOpen}</div>
              {message && <div className="pointer-events-none absolute bottom-2 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-xl bg-red-950/90 px-3 py-2 text-xs">{message}</div>}
            </div>
            <div className="border-t border-sky-500/20 bg-slate-950/90 px-2 sm:px-4 py-2 space-y-2">
              <div className="flex gap-2 justify-center overflow-x-auto">{levelState.monsters.map((m,i)=> <button key={m.id} onClick={()=>selectMonster(i)} className={`min-w-[76px] rounded-xl border px-3 py-1 text-center ${i===levelState.activeMonsterIdx?"border-cyan-300 bg-sky-800/70":"border-white/20 bg-slate-900"}`}><div className="text-xl">{MONSTERS[m.id].icon}</div><div className="text-[10px] font-bold">{MONSTERS[m.id].name[lang].split(" ")[0]}</div></button>)}</div>
              <div className="flex items-center justify-center gap-2 sm:gap-5">
                <div className="grid grid-cols-3 gap-1 shrink-0"><span></span><button aria-label="Up" onClick={()=>performMove("UP")} className="rounded-xl bg-slate-700 w-10 h-9 sm:w-12 sm:h-10">▲</button><span></span><button aria-label="Left" onClick={()=>performMove("LEFT")} className="rounded-xl bg-slate-700 w-10 h-9 sm:w-12 sm:h-10">◀</button><button aria-label="Down" onClick={()=>performMove("DOWN")} className="rounded-xl bg-slate-700 w-10 h-9 sm:w-12 sm:h-10">▼</button><button aria-label="Right" onClick={()=>performMove("RIGHT")} className="rounded-xl bg-slate-700 w-10 h-9 sm:w-12 sm:h-10">▶</button></div>
                <button onClick={useAbility} className="btn-3d rounded-2xl bg-gradient-to-br from-fuchsia-500 to-violet-700 border border-white/30 px-3 sm:px-6 h-[80px] text-sm font-extrabold shadow-lg"><span className="block text-2xl">{activeInfo.icon}</span>{t.ability}</button>
                <div className="flex flex-col gap-1"><button onClick={undoMove} disabled={!history.length} className="rounded-lg border border-white/20 px-3 py-1.5 text-xs disabled:opacity-40">↶ {t.undo}</button><button onClick={()=>setModal("hint")} className="rounded-lg border border-white/20 px-3 py-1.5 text-xs">💡 {t.hint}</button><button onClick={restart} className="rounded-lg border border-white/20 px-3 py-1.5 text-xs">↻ {t.restart}</button></div>
              </div>
              <p className="hidden sm:block text-center text-[11px] text-slate-400">{u.keyboard}</p>
            </div>
          </main>}
          {modal && <div className="fixed inset-0 z-50 bg-[#020617dd] flex items-center justify-center p-4" role="dialog" aria-modal="true"><div className="glass-panel w-full max-w-lg rounded-[30px] p-6 sm:p-8 max-h-[85vh] overflow-y-auto text-center">
            {modal === "intro" && <><div className="text-5xl mb-4">👩‍🚀</div><h2 className="font-title text-xl sm:text-2xl font-bold text-sky-200 mb-4">{t.laraGuideTitle}</h2><p className="text-slate-100 mb-4">{level.laraIntro[lang]}</p><p className="text-xs text-slate-400 mb-5">{u.keyboard}</p>{button(t.gotIt,()=>setModal(null),"🖖")}</>}
            {modal === "hint" && <><div className="text-5xl mb-4">💡</div><h2 className="font-title text-2xl font-bold mb-4">{t.albamenAiTitle}</h2><p className="text-slate-100 mb-6 text-left">{level.hintText[lang]}</p>{button(u.close,()=>setModal(null))}</>}
            {modal === "pause" && <><div className="text-5xl mb-4">🪐</div><h2 className="font-title text-3xl font-bold mb-6">{t.pauseTitle}</h2><div className="flex flex-col gap-3">{button(t.resume,()=>setModal(null),"▶")}{button(t.restart,restart,"↻")}<button onClick={goMenu} className="rounded-2xl border border-white/20 px-5 py-3 font-bold">⌂ {t.backToMenu}</button></div></>}
            {modal === "victory" && <><div className="text-6xl mb-4">🏆</div><h2 className="font-title text-3xl font-bold text-yellow-300 mb-3">{t.levelComplete}</h2><p className="text-xl font-bold mb-2">{u.victory}</p><div className="text-4xl text-yellow-300 my-5 tracking-wider">{"★".repeat(reachedBest || 1)}{"☆".repeat(3-(reachedBest || 1))}</div><p className="mb-5 text-slate-300">{t.moves}: {levelState.moves} · {t.par}: {level.parMoves}</p><div className="flex flex-col gap-3">{!isDaily && level.id < LEVELS.length && button(t.nextLevel,()=>launch(LEVELS[level.id]),"🚀")}{button(u.playAgain,restart,"↻")}<button className="rounded-xl border border-white/20 px-4 py-3 font-bold" onClick={goMenu}>⌂ {t.backToMenu}</button></div></>}
          </div></div>}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
