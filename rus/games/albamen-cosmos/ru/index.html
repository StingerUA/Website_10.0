<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07091A"><title>ALBAMEN Cosmos — Русский</title><base href="/games/albamen-cosmos/"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>.lang,.language-switcher,.language-selector,#auth-lang,[data-lang],select[name="lang"]{display:none!important}</style></head><body><div id="root"></div><script type="module">const LANG='ru';const ACCOUNT_PAGE='/rus/account-menu.html';const original=new URL(location.href);const clean=new URLSearchParams(original.search);clean.delete('lang');const cleanSearch=clean.toString();const forced=new URLSearchParams(clean);forced.set('lang',LANG);history.replaceState(history.state,document.title,location.pathname+'?'+forced.toString()+location.hash);try{localStorage.setItem('albamen_cosmos_lang',LANG)}catch{}document.documentElement.lang=LANG;const redirectIfLoginRequired=()=>{if(!document.querySelector('#auth button#login,.auth-card button#login,button.login#login'))return false;try{sessionStorage.setItem('albaspace_auth_return_to',location.pathname+(cleanSearch?'?'+cleanSearch:'')+location.hash)}catch{}location.href=ACCOUNT_PAGE;return true};const authObserver=new MutationObserver(redirectIfLoginRequired);authObserver.observe(document.documentElement,{childList:true,subtree:true});setTimeout(()=>authObserver.disconnect(),15000);const unpack=async parts=>{const rs=await Promise.all(parts.map(x=>fetch(x,{cache:'no-cache'})));if(rs.some(r=>!r.ok))throw new Error('asset');const b=(await Promise.all(rs.map(r=>r.text()))).map(x=>x.trim()).join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};const loadAtlas=async()=>{const parts=[1,2,3,4,5,6,7,8,9].map(n=>'assets/asteroids-comets/atlas.'+String(n).padStart(2,'0')+'.b64');const rs=await Promise.all(parts.map(x=>fetch(x,{cache:'force-cache'})));if(rs.some(r=>!r.ok))throw new Error('asteroid-atlas');return 'data:image/webp;base64,'+(await Promise.all(rs.map(r=>r.text()))).map(x=>x.trim()).join('')};try{const [css,rawCode]=await Promise.all([unpack(['style-v4.001.00.b64','style-v4.001.01.b64','style-v4.002.b64']),unpack(['app-safe.00.b64','app-safe.01.b64','app-safe.02.b64','app-safe.03.b64','app-safe.04.b64'])]);let code=rawCode;let asteroidCss='';try{const atlas=await loadAtlas();window.__albamenAsteroidsAtlas=atlas;const helper=`function asteroidVisual(id,side,type){const meta=type==='q'?DATA.qmeta[id]:DATA.fcmeta[id];if(!meta)return'';const names=['en','ru','tr'].map(l=>String(DATA.categories&&DATA.categories[l]&&DATA.categories[l][meta.cid]||'').toLowerCase()).join(' ');if(!(/asteroid|comet|астеро|комет|asteroit|kuyruk/.test(names)))return'';const ids=(type==='q'?qids():fids()).filter(x=>(type==='q'?DATA.qmeta[x]:DATA.fcmeta[x]).cid===meta.cid);const idx=ids.indexOf(id);if(idx<0||idx>9)return'';const x=side==='back'?100:0;const y=idx===0?0:(idx/9*100);const label=side==='back'?'Answer illustration':'Question illustration';return '<div class="asteroid-card-visual" role="img" aria-label="'+label+'" style="background-image:url('+window.__albamenAsteroidsAtlas+');background-position:'+x+'% '+y+'%"></div>'}`;if(code.includes('function renderQuiz(){'))code=code.replace('function renderQuiz(){',helper+'function renderQuiz(){');const qNeedle='<section class="panel"><div class="question">';if(code.includes(qNeedle))code=code.replace(qNeedle,'<section class="panel">${asteroidVisual(item.id,quiz.answered?\'back\':\'front\',\'q\')}<div class="question">');const cNeedle='<section class="card flash-card" id="flash-card"><span class="badge">';if(code.includes(cNeedle))code=code.replace(cNeedle,'<section class="card flash-card" id="flash-card">${asteroidVisual(item.id,flipped?\'back\':\'front\',\'fc\')}<span class="badge">');asteroidCss='\n.asteroid-card-visual{width:min(100%,420px);aspect-ratio:1/1;margin:0 auto 18px;border-radius:18px;background-repeat:no-repeat;background-size:200% 1000%;background-color:#0b1028;box-shadow:0 16px 36px rgba(0,0,0,.28)}.flash-card .asteroid-card-visual{margin-top:12px}'}catch(visualError){console.warn('[ALBAMEN Cosmos] asteroid visuals skipped',visualError)}const s=document.createElement('style');s.textContent=css+'\n.lang,.language-switcher,.language-selector,#auth-lang,[data-lang],select[name="lang"]{display:none!important}'+asteroidCss;document.head.appendChild(s);await import(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));redirectIfLoginRequired();history.replaceState(history.state,document.title,location.pathname+(cleanSearch?'?'+cleanSearch:'')+location.hash)}catch(e){console.error('[ALBAMEN Cosmos]',e);document.getElementById('root').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#07091A;color:#F0F4FF;font-family:system-ui;text-align:center;padding:24px"><div><b>ALBAMEN Cosmos</b><p>Не удалось загрузить игру. Обновите страницу.</p></div></div>'}</script></body></html>
