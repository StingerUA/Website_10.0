<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Alba Space — AR-примерка</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;width:100%;height:100%;border:0;background:#000}</style>
</head>
<body>
  <iframe id="game" src="/ar-shop-demo/" title="AR-примерка Alba Space" allow="camera; fullscreen" allowfullscreen></iframe>
  <script>
    (function(){
      const frame=document.getElementById('game');
      const statusMap={
        'Sistem başlatılıyor...':'Запуск системы...',
        'İzleme Modu':'Режим отслеживания',
        'Yükleniyor...':'Загрузка...',
        'Hazır':'Готово',
        'Hata!':'Ошибка!',
        'AR yüklenemedi!':'Не удалось загрузить AR!',
        'Kamera bulunamadı!':'Камера не найдена!'
      };
      function setText(el,value){if(el&&el.textContent.trim()!==value)el.textContent=value}
      function setAttr(el,name,value){if(el&&el.getAttribute(name)!==value)el.setAttribute(name,value)}
      function translate(doc){
        if(!doc)return;
        const status=doc.getElementById('status');
        if(status){const key=status.textContent.trim();if(statusMap[key])setText(status,statusMap[key])}
        const preview=doc.getElementById('preview-image');setAttr(preview,'alt','Предпросмотр');
        const controls=doc.querySelectorAll('#photo-preview .preview-controls button');
        if(controls[0])setText(controls[0],'Отмена');if(controls[1])setText(controls[1],'Сохранить');
        const buttons=doc.querySelectorAll('.bottom-row button');
        const labels=['Уменьшить аксессуар','Предыдущий аксессуар','Сделать фото','Следующий аксессуар','Увеличить аксессуар'];
        buttons.forEach((button,i)=>{if(labels[i]){setAttr(button,'aria-label',labels[i]);setAttr(button,'title',labels[i])}});
        setAttr(doc.documentElement,'lang','ru');
      }
      frame.addEventListener('load',function(){
        try{
          const doc=frame.contentDocument;translate(doc);
          const observer=new MutationObserver(()=>translate(doc));
          observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});
        }catch(err){console.warn('[AR Try-On RU] localization failed',err)}
      });
    })();
  </script>
</body>
</html>
